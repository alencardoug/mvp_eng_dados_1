# As mutações da origem legada entre as duas capturas da janela (PLANO_etapa_13 §7.2, RV13-1-10;
# ADR-0045): o que o `make gcp-legado-mutar` aplica no Cloud SQL, na ordem, uma vez. O diário que
# cada uma grava no manifesto do lote do Cloud SQL é o esperado que o `make gcp-legado-matriz`
# cobra do intervalo e da memória depois da captura seguinte.
#
# Cobre os três destinos de uma chave entre duas certificadas:
#   - remoção física: duas marcas e três clientes, escolhidos pelo oráculo entre as ocorrências
#     aptas do manifesto (`--quantidade`), e não à mão — remover uma rejeitada não provaria nada;
#   - inserção: uma marca nova, que entra no intervalo como `adicionada`;
#   - alteração de conteúdo: o nome da marca nova, que segue presente.
mutacoes:
  - remover: {tabela: brands, quantidade: 2}
  - remover: {tabela: customers, quantidade: 3}
  - inserir: {tabela: brands, valores: {id: "90001", code: "b90001", name: "Marca da janela"}}
  - alterar: {tabela: brands, chave: "90001", coluna: name, valor: "Marca da janela, alterada"}
