# Configuração do Alembic (ADR-0010).
# A URL do banco NÃO vive aqui: é montada em db/migrations/env.py a partir das
# variáveis de ambiente, para que nenhuma credencial seja versionada.

[alembic]
script_location = db/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Segunda origem (ADR-0010 aplicado ao legado, 14/09/2026): `alembic -n legacy`.
# Ambiente e histórico próprios, porque é outro banco com outra história; a
# seção [alembic] continua sendo a da origem principal, e nenhum chamador dela muda.
[legacy]
script_location = db/migrations_legacy
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
