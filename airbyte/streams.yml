# ══════════════════════════════════════════════════════════════════════════════
# Critério de sincronização por tabela — o "arquivo de configuração versionado"
# que o ADR-0015 exige. É a **única** declaração do modo de cada tabela: o
# Terraform lê daqui, e um teste confere que a conexão no Airbyte bate com o que
# está escrito. Tabela sem modo declarado é falha de build, não escolha
# implícita (Qualidade de Dados §3).
#
# A regra do ADR-0015, aplicada linha a linha:
#
#   append            tabela de evento, só cresce, sem UPDATE
#   dedup_history     tem `updated_at` confiável e sofre UPDATE
#   full_refresh      estável, pequena, sem cursor que valha a pena
#
# `cursor` é a coluna que o incremental usa para saber o que mudou, e `chave` é
# a chave primária que o `dedup_history` usa para casar versões da mesma linha.
# ══════════════════════════════════════════════════════════════════════════════

versao: 1

# Nome da origem nos modelos de staging: `stg_<origem>__<tabela>` (ADR-0013).
origem: retail
schema: oltp

# Etapas 5 a 8 — núcleo comercial, financeiro, estoque e entrega. Os demais
# fluxos entram na etapa que os consome: ingerir tabela que nenhum modelo lê é
# volume sem consumidor.
tabelas:

  # ── Domínio fechado: pequeno, estável, sem cursor que compense ─────────────
  customer_segments:
    modo: full_refresh
    motivo: Oito linhas que quase nunca mudam; cursor aqui é cerimônia sem ganho.
  sales_channels:
    modo: full_refresh
    motivo: Três linhas. Carga completa é mais barata que a lógica de estado.
  product_categories:
    modo: full_refresh
    motivo: Hierarquia pequena, e uma recategorização mexe em vários nós de uma vez — carga completa evita reconstruir a árvore a partir de deltas.
  brands:
    modo: full_refresh
    motivo: Cadastro pequeno e de baixa rotatividade.

  payment_methods:
    modo: full_refresh
    motivo: Seis meios de pagamento. Domínio fechado, sem cursor que compense.
  carriers:
    modo: full_refresh
    motivo: Oito transportadoras. Muda quando a operação contrata ou dispensa uma — não vale cursor.
  warehouses:
    modo: full_refresh
    motivo: Cinco armazéns que só mudam quando a operação abre ou fecha um centro.

  # ── Livros de eventos: incremental por acréscimo ──────────────────────────
  # Terceiro modo do ADR-0015, e o que o incremental faz melhor: tabela que só
  # cresce, sem `UPDATE`, dispensa a lógica de deduplicação inteira. Ambas são
  # `AppendOnlyMixin` no modelo — não têm `updated_at` nem `deleted_at`, porque
  # corrigir um evento é inserir outro.
  payment_transactions:
    modo: append
    cursor: created_at
  # Etapa 8. Os dois livros da entrega, e ambos `AppendOnlyMixin` no modelo.
  # `delivery_events` é a **fonte** da data de entrega realizada (ADR-0034), e
  # não um rastro descritivo: o modo de ingestão dele é decisão de primeira
  # ordem, não detalhe. `order_status_history` é o mesmo caso para a transição
  # de estado do pedido.
  delivery_events:
    modo: append
    cursor: created_at
  order_status_history:
    modo: append
    cursor: created_at
  # ── Deixou de ser incremental na Etapa 7 ────────────────────────────────
  # O caminho oficial de ingestão incremental deste livro passou a ser o CDC
  # (ADR-0031). Manter o `append` aqui criaria dois caminhos incrementais para a
  # mesma tabela, e a pergunta "qual dos dois está atrasado?" não teria resposta.
  #
  # `full_refresh` e **não** remover o stream: com ele o Airbyte continua
  # produzindo a segunda opinião sobre o mesmo livro — a área de reconciliação
  # que o Streaming §6 promete e que, até a Etapa 7, não existia. Roda sob
  # demanda, fora do caminho crítico, e é contra ela que o teste
  # `caminhos_de_ingestao_reconciliam` pergunta se o CDC perdeu algum evento.
  inventory_movements:
    modo: full_refresh
    motivo: Deixou de ser incremental na Etapa 7 — o CDC assumiu; esta carga existe para reconciliar contra ele.

  # ── Mutáveis com `updated_at`: dedup + history ────────────────────────────
  customers:
    modo: dedup_history
    cursor: updated_at
    chave: [id]
  customer_addresses:
    modo: dedup_history
    cursor: updated_at
    chave: [id]
  products:
    modo: dedup_history
    cursor: updated_at
    chave: [id]
  product_variants:
    modo: dedup_history
    cursor: updated_at
    chave: [id]
  carts:
    modo: dedup_history
    cursor: updated_at
    chave: [id]
  cart_items:
    modo: dedup_history
    cursor: updated_at
    chave: [id]
  orders:
    modo: dedup_history
    cursor: updated_at
    chave: [id]
  order_items:
    modo: dedup_history
    cursor: updated_at
    chave: [id]

  # ── Financeiro (Etapa 6) ──────────────────────────────────────────────────
  payments:
    modo: dedup_history
    cursor: updated_at
    chave: [id]
  refunds:
    modo: dedup_history
    cursor: updated_at
    chave: [id]

  # ── Compras (Etapa 6) ─────────────────────────────────────────────────────
  suppliers:
    modo: dedup_history
    cursor: updated_at
    chave: [id]
  purchase_orders:
    modo: dedup_history
    cursor: updated_at
    chave: [id]
  purchase_order_items:
    modo: dedup_history
    cursor: updated_at
    chave: [id]
  goods_receipts:
    modo: dedup_history
    cursor: updated_at
    chave: [id]
  goods_receipt_items:
    modo: dedup_history
    cursor: updated_at
    chave: [id]

  # ── Logística ─────────────────────────────────────────────────────────────
  # Estas duas entraram na Etapa 6, antes da fato, porque a invariante 5 —
  # remessa não envia mais do que foi vendido — atravessa `shipment_items` e
  # `order_items`, e um teste é consumidor legítimo. Na Etapa 8 passaram a
  # alimentar `fact_shipment_item`, e o modo não mudou: continuam sofrendo
  # `UPDATE` na origem, a cada mudança de estado da remessa.
  shipments:
    modo: dedup_history
    cursor: updated_at
    chave: [id]
  shipment_items:
    modo: dedup_history
    cursor: updated_at
    chave: [id]

  # ── Estoque (Etapa 6) ─────────────────────────────────────────────────────
  inventory_balances:
    modo: dedup_history
    cursor: updated_at
    chave: [id]
  stock_reservations:
    modo: dedup_history
    cursor: updated_at
    chave: [id]
