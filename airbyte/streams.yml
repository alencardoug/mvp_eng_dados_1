# ══════════════════════════════════════════════════════════════════════════════
# Critério de sincronização por tabela — o "arquivo de configuração versionado"
# que o ADR-0015 exige. É a **única** declaração do modo de cada tabela: o
# Terraform lê daqui, e um teste confere que a conexão no Airbyte bate com o que
# está escrito. Tabela sem modo declarado é falha de build, não escolha
# implícita (Qualidade de Dados §3).
#
# A regra do ADR-0015, aplicada linha a linha:
#
#   append            tabela de evento, só cresce, sem UPDATE
#   dedup_history     tem `updated_at` confiável e sofre UPDATE
#   full_refresh      estável, pequena, sem cursor que valha a pena
#
# `cursor` é a coluna que o incremental usa para saber o que mudou, e `chave` é
# a chave primária que o `dedup_history` usa para casar versões da mesma linha.
# ══════════════════════════════════════════════════════════════════════════════

versao: 1

# Nome da origem nos modelos de staging: `stg_<origem>__<tabela>` (ADR-0013).
origem: retail
schema: oltp

# Etapas 5 e 6 — núcleo comercial, financeiro e estoque. Os demais fluxos entram
# na etapa que os consome: ingerir tabela que nenhum modelo lê é volume sem
# consumidor.
tabelas:

  # ── Domínio fechado: pequeno, estável, sem cursor que compense ─────────────
  customer_segments:
    modo: full_refresh
    motivo: Oito linhas que quase nunca mudam; cursor aqui é cerimônia sem ganho.
  sales_channels:
    modo: full_refresh
    motivo: Três linhas. Carga completa é mais barata que a lógica de estado.
  product_categories:
    modo: full_refresh
    motivo: Hierarquia pequena, e uma recategorização mexe em vários nós de uma vez — carga completa evita reconstruir a árvore a partir de deltas.
  brands:
    modo: full_refresh
    motivo: Cadastro pequeno e de baixa rotatividade.

  payment_methods:
    modo: full_refresh
    motivo: Seis meios de pagamento. Domínio fechado, sem cursor que compense.
  warehouses:
    modo: full_refresh
    motivo: Cinco armazéns que só mudam quando a operação abre ou fecha um centro.

  # ── Livros de eventos: incremental por acréscimo ──────────────────────────
  # Terceiro modo do ADR-0015, e o que o incremental faz melhor: tabela que só
  # cresce, sem `UPDATE`, dispensa a lógica de deduplicação inteira. Ambas são
  # `AppendOnlyMixin` no modelo — não têm `updated_at` nem `deleted_at`, porque
  # corrigir um evento é inserir outro.
  payment_transactions:
    modo: append
    cursor: created_at
  inventory_movements:
    modo: append
    # `recorded_at` é o momento em que a origem registrou o evento, e é a coluna
    # que o Modelo de Dados §5.2 indexa para leitura incremental. `occurred_at`
    # seria errado: evento atrasado tem tempo de negócio antigo, e o cursor o
    # deixaria para trás.
    cursor: recorded_at

  # ── Mutáveis com `updated_at`: dedup + history ────────────────────────────
  customers:
    modo: dedup_history
    cursor: updated_at
    chave: [id]
  customer_addresses:
    modo: dedup_history
    cursor: updated_at
    chave: [id]
  products:
    modo: dedup_history
    cursor: updated_at
    chave: [id]
  product_variants:
    modo: dedup_history
    cursor: updated_at
    chave: [id]
  carts:
    modo: dedup_history
    cursor: updated_at
    chave: [id]
  cart_items:
    modo: dedup_history
    cursor: updated_at
    chave: [id]
  orders:
    modo: dedup_history
    cursor: updated_at
    chave: [id]
  order_items:
    modo: dedup_history
    cursor: updated_at
    chave: [id]

  # ── Financeiro (Etapa 6) ──────────────────────────────────────────────────
  payments:
    modo: dedup_history
    cursor: updated_at
    chave: [id]
  refunds:
    modo: dedup_history
    cursor: updated_at
    chave: [id]

  # ── Compras (Etapa 6) ─────────────────────────────────────────────────────
  suppliers:
    modo: dedup_history
    cursor: updated_at
    chave: [id]
  purchase_orders:
    modo: dedup_history
    cursor: updated_at
    chave: [id]
  purchase_order_items:
    modo: dedup_history
    cursor: updated_at
    chave: [id]
  goods_receipts:
    modo: dedup_history
    cursor: updated_at
    chave: [id]
  goods_receipt_items:
    modo: dedup_history
    cursor: updated_at
    chave: [id]

  # ── Logística — só o necessário para a invariante 5 ───────────────────────
  # A fato de remessa é escopo da Etapa 8. Estas duas entram antes porque a
  # invariante 5 — remessa não envia mais do que foi vendido — atravessa
  # `shipment_items` e `order_items`, e é critério de conclusão da Etapa 6.
  # Um teste é consumidor legítimo: não é volume sem uso.
  shipments:
    modo: dedup_history
    cursor: updated_at
    chave: [id]
  shipment_items:
    modo: dedup_history
    cursor: updated_at
    chave: [id]

  # ── Estoque (Etapa 6) ─────────────────────────────────────────────────────
  inventory_balances:
    modo: dedup_history
    cursor: updated_at
    chave: [id]
  stock_reservations:
    modo: dedup_history
    cursor: updated_at
    chave: [id]
