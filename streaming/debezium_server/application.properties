# GERADO por `python -m mvp_ed1.streaming.debezium_server` a partir de
# streaming/connectors/inventory_movements.yml — não edite: corrija a declaração ou o gerador.
# `${VAR}` é resolvido do ambiente do pod pelo próprio Debezium Server (MicroProfile Config).

# ── O conector, como declarado para a fase local ──
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.tasks.max=1
# fase GCP: o IP privado do Cloud SQL, entregue ao pod pelo ambiente
debezium.source.database.hostname=${SOURCE_DB_HOST}
debezium.source.database.port=${SOURCE_DB_PORT}
debezium.source.database.user=${SOURCE_DB_USER}
debezium.source.database.password=${SOURCE_DB_PASSWORD}
debezium.source.database.dbname=${SOURCE_DB_NAME}
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=mvp_inventory_movements
debezium.source.publication.name=mvp_inventory_movements
debezium.source.publication.autocreate.mode=filtered
debezium.source.schema.include.list=oltp
debezium.source.table.include.list=oltp.inventory_movements
debezium.source.topic.prefix=mvp
debezium.source.snapshot.mode=initial
debezium.source.skipped.operations=none
debezium.source.tombstones.on.delete=false
debezium.source.decimal.handling.mode=string
debezium.source.heartbeat.interval.ms=10000
# fase GCP: o Cloud SQL exige SSL (A16); o local não usa
debezium.source.database.sslmode=require
# fase GCP: o tópico vira `mvp-heartbeat.mvp`, que o Pub/Sub aceita
debezium.source.topic.heartbeat.prefix=mvp-heartbeat

# ── O que só o Debezium Server tem (ADR-0051, D78) ──
# offsets num arquivo: o disco persistente do pod, apagado no desmonte
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
# grava o offset a cada lote confirmado pelo sink
debezium.source.offset.flush.interval.ms=0
# ADR-0051
debezium.sink.type=pubsub
debezium.sink.pubsub.project.id=${GCP_PROJECT_ID}
debezium.format.value=json
# o evento chega sem o schema do Connect
debezium.format.value.schemas.enable=false
debezium.format.key=json
debezium.format.key.schemas.enable=false
# atributo com o valor cru do cabeçalho, sem aspas de JSON (dbz#2783, 3.7.1.Final)
debezium.format.header.schemas.enable=false
# D78
debezium.transforms=unwrap,tempo
# envelope achatado: o evento no topo
debezium.transforms.unwrap.type=io.debezium.transforms.ExtractNewRecordState
# a operação e a posição no WAL ficam como __op e __lsn — o envelope.py recusa u/d por elas
debezium.transforms.unwrap.add.fields=op,lsn
# um DELETE chega como registro com __deleted, e o pipeline falha nele em vez de não vê-lo
debezium.transforms.unwrap.delete.tombstone.handling.mode=rewrite
# o tempo de evento como cabeçalho, que o sink Pub/Sub passa a atributo
debezium.transforms.tempo.type=org.apache.kafka.connect.transforms.HeaderFrom$Value
debezium.transforms.tempo.fields=occurred_at
# o atributo que o Beam lê (fluxo.yml, nuvem)
debezium.transforms.tempo.headers=occurred_at
# o campo continua no evento
debezium.transforms.tempo.operation=copy
# só no tópico de eventos: o heartbeat não tem occurred_at
debezium.transforms.tempo.predicate=eventos
debezium.predicates=eventos
debezium.predicates.eventos.type=org.apache.kafka.connect.transforms.predicates.TopicNameMatches
debezium.predicates.eventos.pattern=mvp\\.oltp\\.inventory_movements
