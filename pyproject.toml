# Declaração do pacote Python do projeto (ADR-0012) e do ambiente (ADR-0026).
# O `uv.lock` ao lado é a trava: ele, e não este arquivo, é o que garante que
# duas máquinas instalem exatamente as mesmas versões.

[project]
name = "mvp-eng-dados-1"
version = "0.1.0"
description = "MVP de engenharia e governança de dados de ponta a ponta sobre um marketplace de varejo omnichannel sintético"
readme = "README.md"
authors = [{ name = "Douglas Alencar" }]

# Fixado na série 3.11 por paridade com o Cloud Composer, que é o orquestrador
# da fase GCP (ADR-0024, princípio P4). Não é ">=3.11": permitir 3.12 aqui
# tornaria o ambiente local diferente do da nuvem sem que ninguém percebesse.
requires-python = ">=3.11,<3.12"

# Cada dependência entra na etapa que a usa, e nenhuma entra sem ADR que a
# justifique. O driver `psycopg` é detalhe de implementação do ADR-0009, não
# escolha de arquitetura: o SQLAlchemy é a fronteira.
dependencies = [
    "SQLAlchemy>=2.0,<3.0",   # ADR-0009 — modelos como fonte de verdade do schema
    "alembic>=1.13,<2.0",     # ADR-0010 — migrações derivadas dos modelos
    "psycopg[binary]>=3.2,<4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mvp_ed1"]
