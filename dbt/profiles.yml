# Perfil de conexão do dbt.
#
# Nenhuma credencial aqui: tudo vem do ambiente, que o `Makefile` carrega do
# `.env` (regra inviolável 1 do CLAUDE.md). É por isso que este arquivo pode ser
# versionado enquanto o `~/.dbt/profiles.yml` da máquina não é usado.

mvp_ed1:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('WAREHOUSE_DB_HOST', 'localhost') }}"
      port: "{{ env_var('WAREHOUSE_DB_PORT') | int }}"
      user: "{{ env_var('WAREHOUSE_DB_USER') }}"
      password: "{{ env_var('WAREHOUSE_DB_PASSWORD') }}"
      dbname: "{{ env_var('WAREHOUSE_DB_NAME') }}"
      schema: analytics
      threads: 4
      keepalives_idle: 0
      connect_timeout: 10

    # Etapa 13 (PLANO_etapa_13 G1): o mesmo projeto no BigQuery. Credencial pela
    # ADC — a do Owner na máquina, a da conta de serviço do ambiente no Composer —,
    # nunca por arquivo de chave (ADR-0025). Os nove schemas viram nove datasets
    # com o mesmo nome (generate_schema_name).
    gcp:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: analytics
      location: "{{ env_var('GCP_BQ_LOCATION', 'us-central1') }}"
      threads: 4
      job_execution_timeout_seconds: 600
      job_retries: 1
      priority: interactive
