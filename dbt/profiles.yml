# Perfil de conexão do dbt.
#
# Nenhuma credencial aqui: tudo vem do ambiente, que o `Makefile` carrega do
# `.env` (regra inviolável 1 do CLAUDE.md). É por isso que este arquivo pode ser
# versionado enquanto o `~/.dbt/profiles.yml` da máquina não é usado.

mvp_ed1:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('WAREHOUSE_DB_HOST', 'localhost') }}"
      port: "{{ env_var('WAREHOUSE_DB_PORT') | int }}"
      user: "{{ env_var('WAREHOUSE_DB_USER') }}"
      password: "{{ env_var('WAREHOUSE_DB_PASSWORD') }}"
      dbname: "{{ env_var('WAREHOUSE_DB_NAME') }}"
      schema: analytics
      threads: 4
      keepalives_idle: 0
      connect_timeout: 10
