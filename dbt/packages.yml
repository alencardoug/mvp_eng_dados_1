# Pacotes dbt. `dbt-expectations` é exigência do ADR-0003: cobre as regras que
# os testes nativos não alcançam — faixa de valor, distribuição, cardinalidade
# e comparação entre colunas.
packages:
  - package: dbt-labs/dbt_utils
    version: [">=1.3.0", "<2.0.0"]
  - package: metaplane/dbt_expectations
    version: [">=0.10.0", "<0.11.0"]
