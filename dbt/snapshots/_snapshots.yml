version: 2

# Escrito à mão: só as medidas acumuladas dos snapshots. Um snapshot guarda uma
# linha por **versão** da entidade, e o acumulado é o da captura que abriu a versão,
# congelado — ele não está em `check_cols`. O texto herdado da tabela de trusted
# (uma linha por entidade, valor atual) diria aditiva (RVL3-03, RVL3-2-04, revisão
# do lote 3 da v1.1.0). O resto de cada entrada é derivado por `make catalog`.

snapshots:
  - name: scd_coupon
    meta:
      domain: marketing
    columns:
      - name: redemption_count
        description: "**Não soma entre versões** — resgates do cupom na captura que abriu esta versão; fica congelado enquanto a versão vale — a coluna não está em `check_cols`, e uma mudança só dela não a atualiza nem abre versão. O valor atual está em `trusted.coupons`."
        meta:
          description_reason: o snapshot guarda o acumulado da captura que abriu a versão, não um valor que acompanha o tempo — o herdado diria aditiva (RVL3-03, RVL3-2-04)
          sensitivity: internal
      - name: redeemed_discount_amount
        description: "**Não soma entre versões** — desconto concedido nos resgates do cupom na captura que abriu esta versão; fica congelado enquanto a versão vale — a coluna não está em `check_cols`, e uma mudança só dela não a atualiza nem abre versão. O valor atual está em `trusted.coupons`."
        meta:
          description_reason: o snapshot guarda o acumulado da captura que abriu a versão, não um valor que acompanha o tempo — o herdado diria aditiva (RVL3-03, RVL3-2-04)
          sensitivity: confidential
      - name: source_system
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: coupon_id
        description: "Identificador do cupom na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: coupon_code
        description: "Código digitado pelo cliente."
        meta:
          description_inherited: true
          sensitivity: public
      - name: campaign_id
        description: "Campanha à qual o cupom pertence."
        meta:
          description_inherited: true
          sensitivity: public
      - name: campaign_code
        description: "Código estável da campanha."
        meta:
          description_inherited: true
          sensitivity: public
      - name: campaign_name
        description: "Nome da campanha."
        meta:
          description_inherited: true
          sensitivity: public
      - name: campaign_objective
        description: "Objetivo comercial da campanha."
        meta:
          description_inherited: true
          sensitivity: public
      - name: discount_type
        description: "Natureza do desconto: percentage ou fixed."
        meta:
          description_inherited: true
          sensitivity: public
      - name: discount_value
        description: "Valor do desconto: percentual quando `percentage`, moeda quando `fixed`."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: min_order_amount
        description: "Valor mínimo de pedido para o cupom ser elegível."
        meta:
          description_inherited: true
          sensitivity: public
      - name: max_redemptions
        description: "Limite total de utilizações; nulo quando ilimitado."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: coupon_valid_from
        description: "Início da vigência do cupom."
        meta:
          description_inherited: true
          sensitivity: public
      - name: coupon_valid_to
        description: "Fim da vigência do cupom."
        meta:
          description_inherited: true
          sensitivity: public
      - name: coupon_is_active
        description: "Indica se o cupom continua aceito."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: first_redeemed_at
        meta:
          sensitivity: internal
      - name: last_redeemed_at
        meta:
          sensitivity: internal
      - name: is_exhausted
        description: "Verdadeiro quando o cupom tem limite de usos e os resgates já o alcançaram."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_redeemable_now
        description: "Verdadeiro quando a data de referência do armazém (`as_of_date`, 01/09/2026) cai dentro da vigência do cupom."
        meta:
          description_inherited: true
          sensitivity: public
      - name: is_deleted
        description: "{{ doc(\"is_deleted\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: source_created_at
        description: "Momento de criação do registro na origem."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: source_updated_at
        description: "Momento da última alteração; cursor da carga incremental (ADR-0015)."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: dbt_scd_id
        description: "{{ doc(\"dbt_scd_id\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: dbt_updated_at
        description: "{{ doc(\"dbt_updated_at\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: dbt_valid_from
        description: "{{ doc(\"dbt_valid_from\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: dbt_valid_to
        description: "{{ doc(\"dbt_valid_to\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
