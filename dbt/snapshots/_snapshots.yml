version: 2

# Escrito à mão: só as medidas acumuladas dos snapshots, cuja aditividade muda com o
# grão — um snapshot guarda uma linha por **versão** da entidade, e o texto herdado
# da tabela de trusted (uma linha por entidade) diria aditiva (RVL3-03, revisão do
# lote 3 da v1.1.0). O resto de cada entrada é derivado por `make catalog`.

snapshots:
  - name: scd_coupon
    meta:
      domain: marketing
    columns:
      - name: redemption_count
        description: "**Semiaditiva** — resgates do cupom até esta versão: soma entre cupons numa mesma data de vigência, nunca entre versões do mesmo cupom."
        meta:
          sensitivity: internal
          description_reason: o snapshot repete a contagem acumulada em cada versão — o herdado diria aditiva
      - name: redeemed_discount_amount
        description: "**Semiaditiva** — desconto concedido nos resgates do cupom até esta versão: soma entre cupons numa mesma data de vigência, nunca entre versões do mesmo cupom."
        meta:
          sensitivity: confidential
          description_reason: o snapshot repete o valor acumulado em cada versão — o herdado diria aditiva
      - name: source_system
        description: "{{ doc(\"source_system\") }}"
        meta:
          sensitivity: internal
      - name: coupon_id
        description: "Identificador do cupom na origem, gerado pelo banco transacional."
        meta:
          sensitivity: internal
      - name: coupon_code
        description: "Código digitado pelo cliente."
        meta:
          sensitivity: public
      - name: campaign_id
        description: "Campanha à qual o cupom pertence."
        meta:
          sensitivity: public
      - name: campaign_code
        description: "Código estável da campanha."
        meta:
          sensitivity: public
      - name: campaign_name
        description: "Nome da campanha."
        meta:
          sensitivity: public
      - name: campaign_objective
        description: "Objetivo comercial da campanha."
        meta:
          sensitivity: public
      - name: discount_type
        description: "Natureza do desconto: percentage ou fixed."
        meta:
          sensitivity: public
      - name: discount_value
        description: "Valor do desconto: percentual quando `percentage`, moeda quando `fixed`."
        meta:
          sensitivity: confidential
      - name: min_order_amount
        description: "Valor mínimo de pedido para o cupom ser elegível."
        meta:
          sensitivity: public
      - name: max_redemptions
        description: "Limite total de utilizações; nulo quando ilimitado."
        meta:
          sensitivity: internal
      - name: coupon_valid_from
        description: "Início da vigência do cupom."
        meta:
          sensitivity: public
      - name: coupon_valid_to
        description: "Fim da vigência do cupom."
        meta:
          sensitivity: public
      - name: coupon_is_active
        description: "Indica se o cupom continua aceito."
        meta:
          sensitivity: internal
      - name: first_redeemed_at
        meta:
          sensitivity: internal
      - name: last_redeemed_at
        meta:
          sensitivity: internal
      - name: is_exhausted
        description: "Verdadeiro quando o cupom tem limite de usos e os resgates já o alcançaram."
        meta:
          sensitivity: internal
      - name: is_redeemable_now
        description: "Verdadeiro quando a data de referência do armazém (`as_of_date`, 01/09/2026) cai dentro da vigência do cupom."
        meta:
          sensitivity: public
      - name: is_deleted
        description: "{{ doc(\"is_deleted\") }}"
        meta:
          sensitivity: internal
      - name: source_created_at
        description: "Momento de criação do registro na origem."
        meta:
          sensitivity: internal
      - name: source_updated_at
        description: "Momento da última alteração; cursor da carga incremental (ADR-0015)."
        meta:
          sensitivity: internal
      - name: dbt_scd_id
        description: "{{ doc(\"dbt_scd_id\") }}"
        meta:
          sensitivity: internal
      - name: dbt_updated_at
        description: "{{ doc(\"dbt_updated_at\") }}"
        meta:
          sensitivity: internal
      - name: dbt_valid_from
        description: "{{ doc(\"dbt_valid_from\") }}"
        meta:
          sensitivity: internal
      - name: dbt_valid_to
        description: "{{ doc(\"dbt_valid_to\") }}"
        meta:
          sensitivity: internal
  - name: scd_customer
    meta:
      domain: clientes
    columns:
      - name: order_count
        description: "**Semiaditiva** — pedidos do cliente até esta versão: soma entre clientes numa mesma data de vigência, nunca entre versões do mesmo cliente."
        meta:
          sensitivity: internal
          description_reason: o snapshot repete a contagem acumulada em cada versão — o herdado diria aditiva entre clientes, sem a vigência
      - name: lifetime_net_revenue_amount
        description: "**Semiaditiva** — receita líquida dos pedidos do cliente até esta versão: soma entre clientes numa mesma data de vigência, nunca entre versões do mesmo cliente."
        meta:
          sensitivity: confidential
          description_reason: o snapshot repete o valor acumulado em cada versão — o herdado diria aditiva entre clientes, sem a vigência
      - name: source_system
        description: "{{ doc(\"source_system\") }}"
        meta:
          sensitivity: internal
      - name: customer_id
        description: "Identificador do cliente na origem, gerado pelo banco transacional."
        meta:
          sensitivity: internal
      - name: customer_code
        description: "Chave natural do cliente na origem; estável entre cargas."
        meta:
          sensitivity: internal
      - name: first_name
        description: "Primeiro nome do cliente (sintético)."
        meta:
          sensitivity: personal
      - name: last_name
        description: "Sobrenome do cliente (sintético)."
        meta:
          sensitivity: personal
      - name: customer_full_name
        description: "Nome completo do cliente: o primeiro nome e o sobrenome, separados por espaço (sintético)."
        meta:
          sensitivity: personal
      - name: customer_document
        description: "Documento de identificação do cliente (sintético)."
        meta:
          sensitivity: personal
      - name: birth_date
        description: "Data de nascimento do cliente (sintética)."
        meta:
          sensitivity: personal
      - name: customer_status
        description: "Estado do relacionamento: active, inactive, blocked ou pending."
        meta:
          sensitivity: internal
      - name: registered_at
        description: "Momento de negócio do cadastro, distinto de `created_at`."
        meta:
          sensitivity: internal
      - name: customer_segment_id
        description: "Segmento comercial ao qual o cliente pertence."
        meta:
          sensitivity: internal
      - name: customer_segment_code
        description: "Código estável do segmento, usado como chave natural."
        meta:
          sensitivity: public
      - name: customer_segment_name
        description: "Nome comercial do segmento."
        meta:
          sensitivity: public
      - name: city
        description: "Cidade; alimenta a dimensão de geografia."
        meta:
          sensitivity: public
      - name: state_code
        description: "Unidade federativa em sigla de duas letras."
        meta:
          sensitivity: public
      - name: country
        description: "País em código ISO de duas letras."
        meta:
          sensitivity: public
      - name: first_order_at
        description: "Instante do primeiro pedido realizado do cliente; nulo para quem nunca comprou."
        meta:
          sensitivity: internal
      - name: last_order_at
        description: "Instante do último pedido realizado do cliente; nulo para quem nunca comprou."
        meta:
          sensitivity: internal
      - name: second_order_at
        meta:
          sensitivity: internal
      - name: is_active
        meta:
          sensitivity: internal
      - name: is_repeat_buyer
        meta:
          sensitivity: internal
      - name: is_churned
        description: "Verdadeiro quando o cliente já comprou, mas o último pedido realizado é anterior a 180 dias da data de referência do armazém (`active_customer_window_days`)."
        meta:
          sensitivity: internal
      - name: days_since_last_order
        description: "Dias entre o último pedido realizado do cliente e a data de referência do armazém; nulo para quem nunca comprou."
        meta:
          sensitivity: internal
      - name: is_deleted
        description: "{{ doc(\"is_deleted\") }}"
        meta:
          sensitivity: internal
      - name: source_created_at
        description: "Momento de criação do registro na origem."
        meta:
          sensitivity: internal
      - name: source_updated_at
        description: "Momento da última alteração; cursor da carga incremental (ADR-0015)."
        meta:
          sensitivity: internal
      - name: dbt_scd_id
        description: "{{ doc(\"dbt_scd_id\") }}"
        meta:
          sensitivity: internal
      - name: dbt_updated_at
        description: "{{ doc(\"dbt_updated_at\") }}"
        meta:
          sensitivity: internal
      - name: dbt_valid_from
        description: "{{ doc(\"dbt_valid_from\") }}"
        meta:
          sensitivity: internal
      - name: dbt_valid_to
        description: "{{ doc(\"dbt_valid_to\") }}"
        meta:
          sensitivity: internal
  - name: scd_support_agent
    meta:
      domain: atendimento
    columns:
      - name: handled_event_count
        description: "**Semiaditiva** — eventos de chamado registrados pelo atendente até esta versão: soma entre atendentes numa mesma data de vigência, nunca entre versões do mesmo atendente."
        meta:
          sensitivity: internal
          description_reason: o snapshot repete a contagem acumulada em cada versão — o herdado diria aditiva
      - name: source_system
        description: "{{ doc(\"source_system\") }}"
        meta:
          sensitivity: internal
      - name: support_agent_id
        description: "Identificador do atendente na origem, gerado pelo banco transacional."
        meta:
          sensitivity: internal
      - name: agent_code
        description: "Chave natural do agente."
        meta:
          sensitivity: internal
      - name: agent_first_name
        description: "Primeiro nome do agente (sintético)."
        meta:
          sensitivity: personal
      - name: agent_last_name
        description: "Sobrenome do agente (sintético)."
        meta:
          sensitivity: personal
      - name: agent_full_name
        description: "Nome completo do atendente: o primeiro nome e o sobrenome, separados por espaço (sintético)."
        meta:
          sensitivity: personal
      - name: agent_email
        description: "E-mail corporativo do agente (sintético)."
        meta:
          sensitivity: personal
      - name: agent_team
        description: "Equipe de atendimento à qual o agente pertence."
        meta:
          sensitivity: public
      - name: hired_at
        description: "Início do período de atuação do agente."
        meta:
          sensitivity: internal
      - name: agent_is_active
        description: "Indica se o agente continua atuando."
        meta:
          sensitivity: internal
      - name: handled_ticket_count
        description: "Não aditiva entre atendentes — chamados distintos em que o atendente registrou algum evento; um chamado atendido por dois conta para os dois."
        meta:
          sensitivity: internal
      - name: is_deleted
        description: "{{ doc(\"is_deleted\") }}"
        meta:
          sensitivity: internal
      - name: source_created_at
        description: "Momento de criação do registro na origem."
        meta:
          sensitivity: internal
      - name: source_updated_at
        description: "Momento da última alteração; cursor da carga incremental (ADR-0015)."
        meta:
          sensitivity: internal
      - name: dbt_scd_id
        description: "{{ doc(\"dbt_scd_id\") }}"
        meta:
          sensitivity: internal
      - name: dbt_updated_at
        description: "{{ doc(\"dbt_updated_at\") }}"
        meta:
          sensitivity: internal
      - name: dbt_valid_from
        description: "{{ doc(\"dbt_valid_from\") }}"
        meta:
          sensitivity: internal
      - name: dbt_valid_to
        description: "{{ doc(\"dbt_valid_to\") }}"
        meta:
          sensitivity: internal
