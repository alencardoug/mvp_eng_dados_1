        meta:
          description_inherited: true
          sensitivity: internal
      - name: last_order_at
        description: "Instante do último pedido realizado do cliente; nulo para quem nunca comprou."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: second_order_at
