# Gerado por `make catalog` (mvp_ed1/models/sensitivity.py). Não edite: a
# classificação e a descrição são derivadas, por linhagem, das declaradas nos
# modelos SQLAlchemy (models/descriptions.py para a descrição). Modelo que
# ganhar entrada num .yml escrito à mão sai daqui na próxima geração.

version: 2
snapshots:
- name: scd_product
  meta:
    domain: catalogo
  columns:
  - name: source_system
    description: '{{ doc("source_system") }}'
    meta:
      sensitivity: internal
  - name: product_variant_id
    description: Identificador da variante do produto (o SKU) na origem, gerado pelo banco transacional.
    meta:
      sensitivity: internal
  - name: sku
    description: Código de estoque da variante; chave natural do SKU.
    meta:
      sensitivity: public
  - name: variant_size
    description: Tamanho da variante.
    meta:
      sensitivity: public
  - name: variant_color
    description: Cor da variante.
    meta:
      sensitivity: public
  - name: variant_package
    description: Embalagem ou unidade de venda.
    meta:
      sensitivity: public
  - name: barcode
    description: Código de barras da variante (sintético).
    meta:
      sensitivity: public
  - name: weight_grams
    description: Peso em gramas, usado no cálculo de frete.
    meta:
      sensitivity: public
  - name: variant_is_active
    description: Indica se o SKU continua disponível para venda.
    meta:
      sensitivity: internal
  - name: product_id
    description: Identificador do produto na origem, gerado pelo banco transacional.
    meta:
      sensitivity: internal
  - name: product_code
    description: Chave natural do produto na origem.
    meta:
      sensitivity: public
  - name: product_name
    description: Nome comercial do produto.
    meta:
      sensitivity: public
  - name: product_status
    description: 'Estado do produto: draft, active ou discontinued.'
    meta:
      sensitivity: internal
  - name: launched_at
    description: Momento de lançamento comercial.
    meta:
      sensitivity: public
  - name: product_category_id
    description: Identificador da categoria na origem, gerado pelo banco transacional.
    meta:
      sensitivity: internal
  - name: leaf_category_name
    description: Nome comercial da categoria.
    meta:
      sensitivity: public
  - name: sub_category_name
    description: Nome da categoria intermediária da variante, entre a raiz e a folha; nulo quando a categoria da variante
      é uma raiz.
    meta:
      sensitivity: public
  - name: root_category_name
    description: Nome da categoria raiz da variante, no topo da árvore de categorias.
    meta:
      sensitivity: public
  - name: category_depth
    description: Profundidade na hierarquia, com a raiz em zero.
    meta:
      sensitivity: public
  - name: brand_id
    description: Identificador da marca na origem, gerado pelo banco transacional.
    meta:
      sensitivity: internal
  - name: brand_name
    description: Nome da marca.
    meta:
      sensitivity: public
  - name: brand_country
    description: País de origem, em código ISO.
    meta:
      sensitivity: public
  - name: is_deleted
    description: Verdadeiro quando a variante, o seu produto ou a sua categoria foi excluído logicamente na origem (ADR-0029).
    meta:
      sensitivity: internal
  - name: variant_is_deleted
    description: '{{ doc("is_deleted") }}'
    meta:
      sensitivity: internal
  - name: product_is_deleted
    description: '{{ doc("is_deleted") }}'
    meta:
      sensitivity: internal
  - name: source_created_at
    description: Momento de criação do registro na origem.
    meta:
      sensitivity: internal
  - name: source_updated_at
    meta:
      sensitivity: internal
  - name: dbt_scd_id
    description: '{{ doc("dbt_scd_id") }}'
    meta:
      sensitivity: internal
  - name: dbt_updated_at
    description: '{{ doc("dbt_updated_at") }}'
    meta:
      sensitivity: internal
  - name: dbt_valid_from
    description: '{{ doc("dbt_valid_from") }}'
    meta:
      sensitivity: internal
  - name: dbt_valid_to
    description: '{{ doc("dbt_valid_to") }}'
    meta:
      sensitivity: internal
