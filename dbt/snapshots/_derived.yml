    meta:
      sensitivity: internal
  - name: is_repeat_buyer
    meta:
      sensitivity: internal
  - name: is_churned
    description: Verdadeiro quando o cliente já comprou, mas o último pedido realizado é anterior a 180 dias da data de referência
