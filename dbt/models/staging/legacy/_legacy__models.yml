# Gerado por make legacy-models; metadados em legacy/classification.py e models/.
version: 2
models:
- name: stg_legacy__brands
  description: Limpeza por coluna de legacy.brands; contexto avaliado em trusted.
  meta:
    domain: legado
    owner: data_custodian
  columns:
  - name: source_system
    description: Sistema que criou o registro; caminho de ingestão não é origem.
    meta:
      sensitivity: internal
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - legacy
  - name: snapshot_id
    description: Identidade da captura no Airbyte.
    meta:
      sensitivity: internal
    data_tests:
    - not_null
  - name: snapshot_at
    description: Instante de extração da ocorrência, com fuso.
    meta:
      sensitivity: internal
    data_tests:
    - not_null
  - name: legacy_row_id
    description: Identidade física na tabela e captura.
    meta:
      sensitivity: internal
    data_tests:
    - not_null
  - name: original_payload
    description: Valores de negócio recebidos, sem alteração; pode conter dados pessoais sintéticos.
    meta:
      sensitivity: personal
  - name: id
    description: Chave primária técnica, gerada pelo banco.
    meta:
      sensitivity: internal
  - name: code
    description: Código estável da marca.
    meta:
      sensitivity: public
  - name: name
    description: Nome da marca.
    meta:
      sensitivity: public
  - name: country
    description: País de origem, em código ISO.
    meta:
      sensitivity: public
  - name: is_active
    description: Indica se a marca continua ativa no catálogo.
    meta:
      sensitivity: internal
  - name: created_at
    description: Momento de criação do registro na origem.
    meta:
      sensitivity: internal
  - name: updated_at
    description: Momento da última alteração; cursor da carga incremental (ADR-0015).
    meta:
      sensitivity: internal
  - name: deleted_at
    description: Exclusão lógica; nulo enquanto o registro está ativo (ADR-0015).
    meta:
      sensitivity: internal
  - name: achados
    description: Primeiro código de valor detectado por coluna, na ordem do catálogo.
    meta:
      sensitivity: internal
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - source_system
        - snapshot_id
        - legacy_row_id
