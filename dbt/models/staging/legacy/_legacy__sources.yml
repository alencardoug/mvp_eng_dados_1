# Gerado por `make legacy-models`. Não edite: a lista sai dos modelos.

version: 2

sources:
  - name: legacy
    description: >
      Capturas retidas da origem legada, escritas pelo Airbyte em modo
      `full_refresh_append` (ADR-0037). **Imutável**: cada carga acrescenta uma
      captura, nenhuma sobrescreve a anterior, e é comparando duas que a
      exclusão física da origem antiga é detectada.

      Os valores chegam como texto, com os defeitos preservados. Tipar aqui
      recusaria justamente as linhas que a etapa existe para tratar.
    database: "{{ target.database }}"
    schema: raw_legacy
    loader: airbyte
    # Governança §8 e ADR-0037: cada captura é retida por acréscimo; o
    # descarte de capturas antigas é decisão futura, não consequência.
    # Acesso (Governança §7): o Airbyte escreve, o dbt lê — `grants` aqui vale
    # para cada tabela desta fonte e é aplicado pelo `on-run-end`.
    meta:
      retention: permanent
      writers: [ingestor]
      grants:
        select: [transformer]

    # Sem `freshness`: a origem legada é capturada sob demanda, e não há
    # promessa de atualidade a cobrar dela — ela é um sistema que ninguém mexe.
    tables:
      - name: brands
        columns:
          - name: _airbyte_raw_id
            description: "{{ doc(\"_airbyte_raw_id\") }}"
            meta:
              sensitivity: internal
          - name: _airbyte_extracted_at
            description: "{{ doc(\"_airbyte_extracted_at\") }}"
            meta:
              sensitivity: internal
          - name: _airbyte_meta
            description: "{{ doc(\"_airbyte_meta\") }}"
            meta:
              sensitivity: internal
          - name: _airbyte_generation_id
            description: "{{ doc(\"_airbyte_generation_id\") }}"
            meta:
              sensitivity: internal
          - name: legacy_row_id
            description: "{{ doc(\"legacy_row_id\") }}"
            meta:
              sensitivity: internal
          - name: id
            description: "Identificador da marca na origem, gerado pelo banco transacional."
            meta:
              sensitivity: internal
          - name: code
            description: "Código estável da marca."
            meta:
              sensitivity: public
          - name: name
            description: "Nome da marca."
            meta:
              sensitivity: public
          - name: country
            description: "País de origem, em código ISO."
            meta:
              sensitivity: public
          - name: is_active
            description: "Indica se a marca continua ativa no catálogo."
            meta:
              sensitivity: internal
          - name: created_at
            description: "Momento de criação do registro na origem."
            meta:
              sensitivity: internal
          - name: updated_at
            description: "Momento da última alteração; cursor da carga incremental (ADR-0015)."
            meta:
              sensitivity: internal
          - name: deleted_at
            description: "Exclusão lógica; nulo enquanto o registro está ativo (ADR-0015)."
            meta:
              sensitivity: internal
