# Gerado por `make legacy-models`. Não edite: a lista sai dos modelos.

version: 2

sources:
  - name: legacy
    description: >
      Capturas retidas da origem legada, escritas pelo Airbyte em modo
      `full_refresh_append` (ADR-0037). **Imutável**: cada carga acrescenta uma
      captura, nenhuma sobrescreve a anterior, e é comparando duas que a
      exclusão física da origem antiga é detectada.

      Os valores chegam como texto, com os defeitos preservados. Tipar aqui
      recusaria justamente as linhas que a etapa existe para tratar.
    database: "{{ env_var('WAREHOUSE_DB_NAME') }}"
    schema: raw_legacy
    loader: airbyte

    # Sem `freshness`: a origem legada é capturada sob demanda, e não há
    # promessa de atualidade a cobrar dela — ela é um sistema que ninguém mexe.
    tables:
      - name: brands
      - name: campaigns
      - name: carriers
      - name: customer_segments
      - name: payment_methods
      - name: product_categories
      - name: sales_channels
      - name: suppliers
      - name: support_agents
      - name: warehouses
      - name: coupons
      - name: customers
      - name: price_lists
      - name: products
      - name: purchase_orders
      - name: carts
      - name: customer_addresses
      - name: customer_contacts
      - name: customer_preferences
      - name: goods_receipts
      - name: product_variants
      - name: cart_items
      - name: inventory_balances
      - name: inventory_movements
      - name: orders
      - name: product_prices
      - name: purchase_order_items
      - name: coupon_redemptions
      - name: goods_receipt_items
      - name: order_items
      - name: order_status_history
      - name: payments
      - name: shipments
      - name: stock_reservations
      - name: delivery_events
      - name: payment_transactions
      - name: shipment_items
      - name: support_tickets
      - name: refunds
      - name: ticket_events

  - name: governance
    description: >
      Controle e auditoria (ADR-0023). O fluxo lê **uma** tabela daqui, e só
      para uma pergunta: esta captura do legado é elegível? É a exceção
      delimitada que o ADR-0044 abre — o certificado por stream de cada
      captura, escrito em duas fases por `mvp_ed1.legacy.captura`.
    database: "{{ env_var('WAREHOUSE_DB_NAME') }}"
    schema: governance
    loader: mvp_ed1.legacy.captura
    tables:
      - name: legacy_captures
        description: >
          Uma linha por tentativa e tabela: origem antes e depois do job
          (contagem e hash de conteúdo), bruto recebido com o `sync_id` do job,
          e o veredito — `complete`, `unstable`, `incomplete`, `inconsistent`,
          `pending`, `abandoned`. Captura elegível = `complete` nas 40 tabelas.
        meta:
          domain: legado
          owner: data_custodian
        columns:
          - name: capture_attempt_id
            description: >
              Identificador da tentativa de captura, aberto na fase 1; uma tentativa tem 40 linhas.
            meta:
              sensitivity: internal
          - name: source_table
            description: >
              Tabela do legado a que a linha se refere.
            meta:
              sensitivity: internal
          - name: connection_name
            description: >
              Conexão do Airbyte que fez a captura (`legacy_para_raw_legacy`).
            meta:
              sensitivity: internal
          - name: job_id
            description: >
              Job do Airbyte, gravado assim que ele nasce; nulo se a tentativa nunca ganhou job.
            meta:
              sensitivity: internal
          - name: snapshot_id
            description: >
              Identidade da captura = o job (`_airbyte_meta.sync_id`); é o que os modelos leem como `legacy_snapshot_id`.
            meta:
              sensitivity: internal
          - name: source_rows_before
            description: >
              Contagem na origem antes de o job nascer (fase 1).
            meta:
              sensitivity: internal
          - name: source_hash_before
            description: >
              Hash de conteúdo da tabela na origem antes do job (`legacy/conteudo.py`).
            meta:
              sensitivity: internal
          - name: source_rows_after
            description: >
              Contagem na origem depois de o job terminar (fase 2).
            meta:
              sensitivity: internal
          - name: source_hash_after
            description: >
              Hash de conteúdo da tabela na origem depois do job.
            meta:
              sensitivity: internal
          - name: received_rows
            description: >
              Linhas no bruto com o `sync_id` deste job.
            meta:
              sensitivity: internal
          - name: received_hash
            description: >
              Hash de conteúdo do que chegou ao bruto com o `sync_id` deste job.
            meta:
              sensitivity: internal
          - name: sync_id_matches
            description: >
              A geração desta tabela só tem linhas deste job, e o job só escreveu uma geração nela.
            meta:
              sensitivity: internal
          - name: status
            description: >
              Veredito por tabela: `pending`, `complete`, `unstable`, `incomplete`, `inconsistent` ou `abandoned`.
            meta:
              sensitivity: internal
          - name: started_at
            description: >
              Instante da fase 1 (medição "antes").
            meta:
              sensitivity: internal
          - name: completed_at
            description: >
              Instante da fase 2, ou do abandono.
            meta:
              sensitivity: internal
