version: 2

sources:
  - name: retail
    description: >
      Réplica das tabelas de `oltp` no schema `raw`, escrita pelo Airbyte. Cobre
      os cortes comercial (Etapa 5), financeiro e de estoque (Etapa 6), de
      entrega (Etapa 8) e de relacionamento (Etapa 9). Cada tabela entra na
      etapa que a consome — ingerir tabela que nenhum modelo lê é volume sem
      consumidor.
    database: "{{ env_var('WAREHOUSE_DB_NAME') }}"
    schema: raw
    loader: airbyte
    # Governança §8: os lotes em `raw` são os necessários à reconciliação, e é
    # o modo de sincronização (ADR-0015: `append` e `dedup + history`) que os
    # retém — nada aqui descarta. Permanente enquanto a origem existir.
    #
    # Acesso (Governança §7): dois escritores, cada um dono do que escreve —
    # o Airbyte (`ingestor`) e o pipeline Beam (`streamer`, ADR-0031) —, e um
    # leitor, o dbt. O dbt não concede em fonte; `grants` aqui vale para cada
    # tabela desta fonte e é aplicado pelo `on-run-end` (`aplicar_acesso_por_camada`).
    meta:
      retention: permanent
      writers: [ingestor, streamer]
      grants:
        select: [transformer]

    # O Airbyte escreve estas quatro colunas em toda tabela. `_airbyte_extracted_at`
    # é o carimbo da carga — não confundir com `updated_at`, que é o tempo de
    # negócio e o cursor declarado em `airbyte/streams.yml` (ADR-0015).
    freshness:
      warn_after: { count: 24, period: hour }
      error_after: { count: 72, period: hour }
    loaded_at_field: _airbyte_extracted_at

    tables:
      # ── Domínio fechado: carga completa ──────────────────────────────────
      - name: customer_segments
        columns:
          - name: _airbyte_raw_id
            meta:
              sensitivity: internal
