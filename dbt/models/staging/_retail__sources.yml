          - name: id
            description: "Chave primária técnica, gerada pelo banco."
            meta:
              sensitivity: internal
          - name: code
            description: "Código estável do segmento, usado como chave natural."
            meta:
              sensitivity: public
          - name: name
            description: "Nome comercial do segmento."
            meta:
              sensitivity: public
          - name: description
            description: "Critério de enquadramento do segmento."
            meta:
              sensitivity: public
          - name: is_active
            description: "Indica se o segmento continua em uso."
            meta:
              sensitivity: internal
          - name: created_at
            description: "Momento de criação do registro na origem."
            meta:
              sensitivity: internal
          - name: updated_at
            description: "Momento da última alteração; cursor da carga incremental (ADR-0015)."
            meta:
              sensitivity: internal
          - name: deleted_at
            description: "Exclusão lógica; nulo enquanto o registro está ativo (ADR-0015)."
            meta:
              sensitivity: internal
