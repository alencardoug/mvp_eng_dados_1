      # ── Caminho quente (ADR-0031) ───────────────────────────────────────
      # Escrita pelo pipeline Beam, não pelo Airbyte. Aterrissa em `raw` porque
      # é ingestão, que é a função da camada — e assim o `staging` continua
      # lendo só de `raw`, sem inverter a ordem que o ADR-0008 fixou.
      - name: inventory_movements_stream
        description: >
          Deltas imutáveis do CDC, um por movimento, gravados pelo pipeline Beam
          com idempotência por `movement_id` (ADR-0019). Caminho oficial de
          ingestão incremental do livro de estoque.
        loaded_at_field: _stream_extracted_at
        # Substitui o `grants` da fonte só nesta tabela (lista completa):
        # `insert` é a escrita do `streamer`; `select` porque o
        # `on conflict do nothing ... returning` lê a chave.
        meta:
          grants:
            select: [streamer, transformer]
            insert: [streamer]
        columns:
          - name: movement_id
