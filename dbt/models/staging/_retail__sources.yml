version: 2

sources:
  - name: retail
    description: >
      Réplica das tabelas de `oltp` no schema `raw`, escrita pelo Airbyte. Cobre
      os cortes comercial (Etapa 5), financeiro e de estoque (Etapa 6); os
      demais domínios entram na etapa que os consome — ingerir tabela que nenhum
      modelo lê é volume sem consumidor.
    database: "{{ env_var('WAREHOUSE_DB_NAME') }}"
    schema: raw
    loader: airbyte

    # O Airbyte escreve estas quatro colunas em toda tabela. `_airbyte_extracted_at`
    # é o carimbo da carga — não confundir com `updated_at`, que é o tempo de
    # negócio e o cursor declarado em `airbyte/streams.yml` (ADR-0015).
    freshness:
      warn_after: { count: 24, period: hour }
      error_after: { count: 72, period: hour }
    loaded_at_field: _airbyte_extracted_at

    tables:
      # ── Domínio fechado: carga completa ──────────────────────────────────
      - name: customer_segments
      - name: sales_channels
      - name: product_categories
      - name: brands
        freshness: null

      # ── Mutáveis com cursor: dedup + history ─────────────────────────────
      - name: customers
      - name: customer_addresses
      - name: products
      - name: product_variants
      - name: carts
      - name: cart_items
        description: Maior tabela do projeto; ver Modelo de Dados §2.4.
      - name: orders
      - name: order_items

      # ── Financeiro (Etapa 6) ────────────────────────────────────────────
      - name: payment_methods
      - name: payments
      - name: refunds

      # ── Compras (Etapa 6) ───────────────────────────────────────────────
      - name: suppliers
      - name: purchase_orders
      - name: purchase_order_items
      - name: goods_receipts
      - name: goods_receipt_items

      # ── Logística — só o que a invariante 5 exige (a fato é da Etapa 8) ──
      - name: shipments
      - name: shipment_items

      # ── Estoque (Etapa 6) ───────────────────────────────────────────────
      - name: warehouses
      - name: inventory_balances
      - name: stock_reservations

      # ── Livros de eventos ───────────────────────────────────────────────
      # Só crescem, e por isso são ingeridos por acréscimo.
      - name: payment_transactions

      # `inventory_movements` deixou de ser ingerido por acréscimo na Etapa 7: o
      # caminho oficial passou a ser o CDC, e o Airbyte ficou com carga completa
      # sob demanda. Esta tabela é hoje a **área de reconciliação** que o
      # Streaming §6 promete — a segunda opinião sobre o mesmo livro.
      - name: inventory_movements
        description: >
          Carga completa do livro pelo Airbyte, fora do caminho crítico. Serve de
          contraprova ao caminho quente, não de fonte incremental (ADR-0031).
        freshness: null

      # ── Caminho quente (ADR-0031) ───────────────────────────────────────
      # Escrita pelo pipeline Beam, não pelo Airbyte. Aterrissa em `raw` porque
      # é ingestão, que é a função da camada — e assim o `staging` continua
      # lendo só de `raw`, sem inverter a ordem que o ADR-0008 fixou.
      - name: inventory_movements_stream
        description: >
          Deltas imutáveis do CDC, um por movimento, gravados pelo pipeline Beam
          com idempotência por `movement_id` (ADR-0019). Caminho oficial de
          ingestão incremental do livro de estoque.
        loaded_at_field: _stream_extracted_at
