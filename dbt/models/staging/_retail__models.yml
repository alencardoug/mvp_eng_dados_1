  - name: stg_retail__coupons
    meta:
      domain: marketing
    description: >
      Cupons com as três condições que a invariante 12 verifica: vigência, piso
      do pedido e teto de resgates. Nulo em `min_order_amount` é *sem piso*; em
      `max_redemptions`, *sem teto*.
    columns:
      - name: coupon_id
        description: "Identificador do cupom na origem, gerado pelo banco transacional."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: coupon_code
        description: "Código digitado pelo cliente."
        meta:
          sensitivity: public
        data_tests: [unique, not_null]
      - name: campaign_id
        description: "Campanha à qual o cupom pertence."
        meta:
          sensitivity: public
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_retail__campaigns')
              field: campaign_id
      - name: discount_type
        description: "Natureza do desconto: percentage ou fixed."
        meta:
          sensitivity: public
        data_tests:
          - not_null
          - accepted_values: {values: [percentage, fixed]}
      - name: discount_value
        description: "Valor do desconto: percentual quando `percentage`, moeda quando `fixed`."
        meta:
          sensitivity: confidential
      - name: min_order_amount
        description: "Valor mínimo de pedido para o cupom ser elegível."
        meta:
          sensitivity: public
      - name: max_redemptions
        description: "Limite total de utilizações; nulo quando ilimitado."
        meta:
          sensitivity: internal
      - name: coupon_valid_from
        description: "Início da vigência do cupom."
        meta:
          sensitivity: public
      - name: coupon_valid_to
        description: "Fim da vigência do cupom."
        meta:
          sensitivity: public
      - name: coupon_is_active
        description: "Indica se o cupom continua aceito."
        meta:
          sensitivity: internal
      - name: source_created_at
        description: "Momento de criação do registro na origem."
        meta:
          sensitivity: internal
      - name: source_updated_at
        description: "Momento da última alteração; cursor da carga incremental (ADR-0015)."
        meta:
          sensitivity: internal
      - name: source_deleted_at
        description: "Exclusão lógica; nulo enquanto o registro está ativo (ADR-0015)."
        meta:
          sensitivity: internal
      - name: is_deleted
        description: "{{ doc(\"is_deleted\") }}"
        meta:
          sensitivity: internal
      - name: ingested_at
        description: "{{ doc(\"_airbyte_extracted_at\") }}"
        meta:
          sensitivity: internal

  - name: stg_retail__coupon_redemptions
    meta:
      domain: marketing
    description: Um resgate por pedido, garantido por índice único na origem.
    columns:
      - name: coupon_redemption_id
        description: "Identificador do resgate de cupom na origem, gerado pelo banco transacional."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: order_id
        meta:
          sensitivity: internal
          description_reason: "acrescenta ao significado herdado a restrição que o teste deste modelo cobra"
        description: Único — dois cupons no mesmo pedido tornariam o rateio do desconto ambíguo.
        data_tests: [unique, not_null]
      - name: coupon_id
        description: "Cupom utilizado."
        meta:
          sensitivity: internal
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_retail__coupons')
              field: coupon_id
      - name: customer_id
        description: "Cliente que utilizou o cupom."
        meta:
          sensitivity: internal
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_retail__customers')
              field: customer_id
      - name: coupon_discount_amount
        description: "Desconto efetivamente concedido."
        meta:
          sensitivity: confidential
      - name: redeemed_at
        description: "Momento de negócio da utilização."
        meta:
          sensitivity: internal
      - name: source_created_at
        description: "Momento em que o evento foi registrado na origem."
        meta:
          sensitivity: internal
      - name: is_deleted
        description: "{{ doc(\"is_deleted_append_only\") }}"
        meta:
          sensitivity: internal
      - name: ingested_at
        description: "{{ doc(\"_airbyte_extracted_at\") }}"
        meta:
          sensitivity: internal

