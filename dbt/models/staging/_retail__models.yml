  - name: stg_retail__support_tickets
    meta:
      domain: atendimento
    description: >
      Chamados. `order_id` é nulo em parte deles — nem todo contato nasce de um
      pedido —, e é esse nulo que os exclui da comparação de P16 (ADR-0036).
    columns:
      - name: support_ticket_id
        description: "Identificador do chamado na origem, gerado pelo banco transacional."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: ticket_number
        description: "Número do chamado; chave natural."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: customer_id
        description: "Cliente que abriu o chamado."
        meta:
          sensitivity: internal
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_retail__customers')
              field: customer_id
      - name: ticket_category
        description: "Motivo do chamado."
        meta:
          sensitivity: public
        data_tests:
          - not_null
          - accepted_values:
              values: [delivery, payment, product, return, account, other]
      - name: ticket_status
        description: "Estado atual do chamado."
        meta:
          sensitivity: internal
        data_tests:
          - not_null
          - accepted_values:
              values: [open, in_progress, waiting_customer, resolved, closed]
      - name: order_id
        description: "Pedido relacionado ao chamado, quando houver."
        meta:
          sensitivity: internal
      - name: shipment_id
        description: "Remessa relacionada ao chamado, quando houver."
        meta:
          sensitivity: internal
      - name: assigned_agent_id
        description: "Agente responsável pelo chamado no momento."
        meta:
          sensitivity: internal
      - name: ticket_priority
        description: "Prioridade atribuída ao chamado."
        meta:
          sensitivity: internal
      - name: ticket_subject
        description: "Assunto escrito pelo cliente (sintético)."
        meta:
          sensitivity: personal
      - name: opened_at
        description: "Momento de abertura do chamado."
        meta:
          sensitivity: internal
      - name: closed_at
        description: "Momento de encerramento do chamado."
        meta:
          sensitivity: internal
      - name: source_created_at
        description: "Momento de criação do registro na origem."
        meta:
          sensitivity: internal
      - name: source_updated_at
        description: "Momento da última alteração; cursor da carga incremental (ADR-0015)."
        meta:
          sensitivity: internal
      - name: source_deleted_at
        description: "Exclusão lógica; nulo enquanto o registro está ativo (ADR-0015)."
        meta:
          sensitivity: internal
      - name: is_deleted
        description: "{{ doc(\"is_deleted\") }}"
        meta:
          sensitivity: internal
      - name: ingested_at
        description: "{{ doc(\"_airbyte_extracted_at\") }}"
        meta:
          sensitivity: internal

  - name: stg_retail__ticket_events
    meta:
      domain: atendimento
    description: '`support_agent_id` nulo é autor **cliente**, não dado faltando.'
    columns:
      - name: ticket_event_id
        description: "Identificador do evento do chamado na origem, gerado pelo banco transacional."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: support_ticket_id
        description: "Chamado ao qual o evento pertence."
        meta:
          sensitivity: internal
        data_tests:
          - not_null
          - relationships:
