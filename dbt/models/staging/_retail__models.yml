        meta:
          sensitivity: internal
      - name: is_deleted
        description: "{{ doc(\"is_deleted_append_only\") }}"
        meta:
          sensitivity: internal
      - name: ingested_at
        description: "{{ doc(\"_airbyte_extracted_at\") }}"
        meta:
          sensitivity: internal
