version: 2

# Escrito à mão: o texto das colunas de `trusted` que **calculam** o seu valor —
# marcas, contagens, somas, prazos (etapa 1.8, Governança §5.1). O resto deste
# arquivo é derivado por `make catalog`: a sensibilidade e o domínio de cada
# modelo, e a descrição de cada coluna que só transporta um valor da origem. Não
# edite o derivado; para divergir dele, `description_reason` ou `domain_reason`.

models:
  - name: campaigns
    meta:
      domain: marketing
    columns:
      - name: is_finished
        meta:
          sensitivity: public
        description: "Verdadeiro quando a vigência da campanha terminou antes de a data de referência do armazém (`as_of_date`, 01/09/2026)."
      - name: is_running
        meta:
          sensitivity: public
        description: "Verdadeiro quando a data de referência do armazém (`as_of_date`, 01/09/2026) cai dentro da vigência da campanha."
      - name: source_system
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: campaign_id
        description: "Identificador da campanha na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: campaign_code
        description: "Código estável da campanha."
        meta:
          description_inherited: true
          sensitivity: public
      - name: campaign_name
        description: "Nome da campanha."
        meta:
          description_inherited: true
          sensitivity: public
      - name: campaign_objective
        description: "Objetivo comercial da campanha."
        meta:
          description_inherited: true
          sensitivity: public
      - name: campaign_valid_from
        description: "Início da vigência da campanha."
        meta:
          description_inherited: true
          sensitivity: public
      - name: campaign_valid_to
        description: "Fim da vigência da campanha."
        meta:
          description_inherited: true
          sensitivity: public
      - name: budget_amount
        description: "Orçamento previsto da campanha."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: campaign_is_active
        description: "Indica se a campanha está ativa."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_deleted
        description: "{{ doc(\"is_deleted\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: source_created_at
        description: "Momento de criação do registro na origem."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: source_updated_at
        description: "Momento da última alteração; cursor da carga incremental (ADR-0015)."
        meta:
          description_inherited: true
          sensitivity: internal

