  - name: inventory_movements
    meta:
      domain: estoque
    columns:
      - name: event_sequence
        meta:
          sensitivity: internal
        description: "Ordem do evento dentro da sua origem. No varejo, a sequência técnica que o banco atribui; no legado, a identidade física da linha na captura — desempate técnico, sem promessa de ordem de negócio (D40)."
      - name: is_inbound
        meta:
          sensitivity: internal
        description: "Verdadeiro quando o movimento é de entrada: todo tipo que não é venda, devolução a fornecedor, transferência de saída ou ajuste de saída."
      - name: is_outbound
        meta:
          sensitivity: internal
        description: "Verdadeiro quando o movimento é de saída: venda (`sale_dispatch`), devolução a fornecedor, transferência de saída ou ajuste de saída."
      - name: is_sale
        meta:
          sensitivity: internal
        description: "Verdadeiro quando o movimento é a saída de uma venda (`sale_dispatch`)."
      - name: movement_cost_amount
        meta:
          sensitivity: confidential
        description: "Aditiva — custo do movimento: a quantidade movimentada, em valor absoluto, vezes o custo unitário (zero sem custo), arredondado a centavos."
      - name: quantity_in
        meta:
          sensitivity: internal
        description: "Aditiva — unidades que entraram no movimento; zero numa saída."
      - name: quantity_out
        meta:
          sensitivity: internal
        description: "Aditiva — unidades que saíram no movimento, em número positivo; zero numa entrada."
      - name: recording_delay_seconds
        meta:
          sensitivity: internal
        description: "Segundos entre o instante de negócio do movimento e o seu registro na origem."
      - name: source_system
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: movement_id
        description: "Chave primária estável do evento."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: idempotency_key
        description: "Chave que impede aplicação duplicada pelo consumidor (ADR-0019)."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: warehouse_id
        description: "Armazém afetado pelo movimento."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: product_variant_id
        description: "SKU afetado pelo movimento."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: movement_type
        description: "Tipo controlado do movimento; determina o sinal da quantidade."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: source_type
        description: "Processo de negócio que originou o movimento."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: source_id
        description: "Identificador do registro que causou o movimento."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: correlation_id
        description: "Agrupa eventos relacionados; obrigatório nos pares de transferência."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: causation_id
        description: "Evento ou comando que causou este movimento."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: aggregate_version
        description: "Ordem do evento dentro do par armazém/SKU; sem lacuna nem repetição."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: occurred_at
        description: "Momento de negócio do movimento; é por ele que o Beam janela (ADR-0019)."
        meta:
          description_inherited: true
