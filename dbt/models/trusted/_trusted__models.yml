        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: cart_id
        description: "Identificador do carrinho na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: event_type
        description: "Estado do carrinho: open, converted, abandoned ou expired."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: customer_id
        description: "Cliente dono do carrinho; nulo em sessão anônima."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: sales_channel_id
        description: "Canal em que o carrinho foi aberto."
