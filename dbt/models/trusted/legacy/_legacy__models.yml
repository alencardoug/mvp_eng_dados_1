# Gerado por make legacy-models; metadados em legacy/classification.py e models/.
version: 2
models:
- name: legacy_records
  description: Ocorrências da captura selecionada, com o contrato derivado do SQLAlchemy.
  meta:
    domain: legado
    owner: data_custodian
  columns:
  - name: source_system
    description: Sistema que criou o registro; caminho de ingestão não é origem.
    meta:
      sensitivity: internal
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - legacy
  - name: snapshot_id
    description: Identidade da captura no Airbyte.
    meta:
      sensitivity: internal
    data_tests:
    - not_null
  - name: snapshot_at
    description: Instante de extração da ocorrência, com fuso.
    meta:
      sensitivity: internal
    data_tests:
    - not_null
  - name: legacy_row_id
    description: Identidade física na tabela e captura.
    meta:
      sensitivity: internal
    data_tests:
    - not_null
  - name: original_payload
    description: Valores de negócio recebidos, sem alteração; pode conter dados pessoais sintéticos.
    meta:
      sensitivity: personal
  - name: source_table
    description: Tabela de origem.
    meta:
      sensitivity: internal
  - name: cleaned_payload
    description: Valores tratados por coluna.
    meta:
      sensitivity: personal
  - name: value_findings
    description: Achados de valor por coluna.
    meta:
      sensitivity: internal
  - name: record_contract
    description: Obrigatoriedade, chaves e FKs derivadas dos modelos.
    meta:
      sensitivity: internal
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - source_system
        - snapshot_id
        - source_table
        - legacy_row_id
- name: legacy_classifications
  description: Três saídas exclusivas com falhas de contexto e rejeição em cascata.
  meta:
    domain: legado
    owner: data_custodian
  columns:
  - name: source_system
    description: Sistema que criou o registro; caminho de ingestão não é origem.
