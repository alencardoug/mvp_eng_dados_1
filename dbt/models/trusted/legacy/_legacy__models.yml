  - name: catalog_version
    description: Versão do contrato de tratamento aplicado.
    meta:
      sensitivity: internal
    data_tests:
    - not_null
  - name: treatment_fingerprint
    description: Identidade do tratamento que produziu esta linha, derivada do SQL gerado (D34).
    meta:
      sensitivity: internal
    data_tests:
    - not_null
  - name: cleaned_payload
    description: Valores após conversão; inválidos preservados, nunca preenchidos por adivinhação.
    meta:
      sensitivity: personal
  - name: classification
    description: Saída exclusiva da ocorrência, depois de todos os achados.
    meta:
      sensitivity: internal
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - accepted
          - corrected
          - rejected
  - name: rejection_origin
    description: 'Categoria exclusiva: defeito próprio, excedente ou cascata.'
    meta:
      sensitivity: internal
    data_tests:
    - accepted_values:
        arguments:
          values:
          - own_invalid
          - duplicate_excess
          - parent_rejected
  - name: findings
    description: Todos os achados, ações, motivos, valores e vínculos causais. Pode conter dados pessoais
      sintéticos.
    meta:
      sensitivity: personal
  data_tests:
