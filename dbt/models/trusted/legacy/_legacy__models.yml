- name: legacy_presence_by_capture
  description: Linhas físicas por captura certificada, tabela e chave canônica, com os payloads brutos.
  meta:
    domain: legado
    owner: data_custodian
  columns:
  - name: source_table
    description: Tabela de origem.
    meta:
      sensitivity: internal
    data_tests:
    - not_null
  - name: snapshot_id
    description: Captura certificada (ou a selecionada).
    meta:
      sensitivity: internal
    data_tests:
    - not_null
  - name: business_key
    description: PK declarada, canonizada pelo tipo; nulo é linha sem identidade.
    meta:
      sensitivity: internal
  - name: n
    description: Linhas físicas com esta chave nesta captura.
    meta:
      sensitivity: internal
    data_tests:
    - not_null
  - name: payloads
    description: Payloads brutos das linhas, em ordem física. Pode conter dados pessoais sintéticos.
    meta:
      sensitivity: personal
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - source_table
        - snapshot_id
        - business_key
- name: legacy_capture_transitions
  description: Intervalo entre a certificada anterior mais recente e a selecionada, por chave e com multiplicidade.
  meta:
    domain: legado
    owner: data_custodian
  columns:
  - name: previous_snapshot_id
    description: Certificada anterior mais recente.
    meta:
      sensitivity: internal
    data_tests:
    - not_null
  - name: selected_snapshot_id
    description: Captura selecionada.
    meta:
      sensitivity: internal
    data_tests:
    - not_null
  - name: source_table
    description: Tabela de origem.
    meta:
      sensitivity: internal
    data_tests:
    - not_null
  - name: business_key
    description: PK canonizada; nulo agrupa as linhas sem identidade.
    meta:
      sensitivity: internal
  - name: rows_before
    description: Linhas físicas na anterior.
    meta:
      sensitivity: internal
    data_tests:
    - not_null
  - name: rows_after
    description: Linhas físicas na selecionada.
    meta:
      sensitivity: internal
    data_tests:
    - not_null
  - name: transition
    description: removida, adicionada, reduzida, aumentada, mantida ou sem_identidade.
    meta:
      sensitivity: internal
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - removida
          - adicionada
          - reduzida
          - aumentada
          - mantida
          - sem_identidade
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - source_table
        - business_key
- name: legacy_removed_records
  description: 'Memória da ausência: chaves vistas em certificada anterior e ausentes na selecionada;
    auditoria, fora de equação.'
  meta:
    domain: legado
    owner: data_custodian
  columns:
  - name: source_table
    description: Tabela de origem.
    meta:
      sensitivity: internal
    data_tests:
    - not_null
  - name: business_key
    description: PK canonizada.
    meta:
      sensitivity: internal
    data_tests:
    - not_null
  - name: last_seen_snapshot_id
    description: Maior captura certificada em que a chave esteve.
    meta:
      sensitivity: internal
    data_tests:
    - not_null
  - name: removed_in_snapshot_id
    description: Menor certificada posterior ao last_seen — onde faltou pela primeira vez.
    meta:
      sensitivity: internal
    data_tests:
    - not_null
  - name: observed_in_snapshot_id
    description: Captura selecionada em que a ausência foi observada.
    meta:
      sensitivity: internal
    data_tests:
    - not_null
  - name: rows_last_seen
    description: Linhas físicas com a chave na última captura em que existiu.
    meta:
      sensitivity: internal
  - name: last_payload
    description: Payloads brutos da última captura em que a chave existiu — não tratados. Pode conter
      dados pessoais sintéticos.
    meta:
      sensitivity: personal
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - source_table
        - business_key
