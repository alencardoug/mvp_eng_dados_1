        meta:
          sensitivity: internal
      - name: source_type
        meta:
          sensitivity: internal
      - name: source_id
        meta:
          sensitivity: internal
      - name: correlation_id
        meta:
          sensitivity: internal
      - name: aggregate_version
        meta:
          sensitivity: internal
      - name: occurred_at
        meta:
          sensitivity: internal
      - name: recorded_at
        meta:
          sensitivity: internal
      - name: movement_date
        meta:
          sensitivity: internal
      - name: is_inbound
        meta:
