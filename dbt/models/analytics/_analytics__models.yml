      - name: po_number
        description: "Número da ordem de compra; chave natural."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: purchase_order_status
        description: "Estado da ordem; transições válidas em Modelo de Dados §4."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: ordered_at
        description: "Momento de emissão da ordem."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: expected_at
        description: "Data prometida de entrega pelo fornecedor."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: first_received_at
        description: "Instante do primeiro recebimento **concluído** da linha; nulo enquanto nenhum foi concluído."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: last_received_at
        description: "Instante do último recebimento **concluído** da linha; nulo enquanto nenhum foi concluído."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_fully_received
        description: "Verdadeiro quando a quantidade recebida em recebimentos concluídos alcança a pedida."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_not_received
        description: "Verdadeiro quando nenhuma unidade da linha chegou em recebimento concluído."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_cancelled
        description: "Verdadeiro quando o pedido de compra está cancelado."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: quantity_received
        description: "Aditiva — unidades recebidas da linha, somando só os recebimentos **concluídos**; zero enquanto nenhum foi concluído."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: quantity_outstanding
        description: "Aditiva — unidades pedidas que ainda não chegaram em recebimento concluído."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: unit_cost
        description: "Custo unitário negociado."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: ordered_cost_amount
        description: "Custo total do item, já arredondado."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: received_cost_amount
        description: "Aditiva — custo do que chegou: a quantidade recebida vezes o custo unitário de cada recebimento **concluído**, arredondado a centavos."
        meta:
          description_inherited: true
          sensitivity: confidential

  - name: fact_inventory_movement
    meta:
      domain: estoque
    description: >
      **Grão: um movimento de um SKU em um armazém.** Única fato `incremental`
      do projeto (ADR-0016), com as quatro proteções obrigatórias: `unique_key`,
      filtro por tempo de evento com margem, `--full-refresh` no plano da Etapa
      12, e o teste `incremental_confere_com_a_reconstrucao_completa`.
      A exceção tem **duas estratégias, uma por origem** (ADR-0042): `retail`
      chega por evento e entra por `merge` com a janela de atraso; `legacy` chega
      por captura e entra por `delete+insert`, com a partição reescrita inteira a
      cada execução. Para o ramo legado a idempotência vem do recorte por
      captura, não da `unique_key`, e a reconciliação por linha está em
      `legado_na_fato_segue_a_captura_corrente`.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, idempotency_key]
      - fato_reconcilia_com_a_condutora:
          config:
            tags: [fronteira]
          arguments:
            condutora: ref('inventory_movements')
            medidas:
              quantity_delta: quantity_delta
              cogs_amount: cogs_amount
    columns:
      - name: movement_key
        description: "Chave substituta do movimento de estoque: hash de `source_system` e `movement_id` (ADR-0017)."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: movement_id
        meta:
          sensitivity: internal
          description_reason: "diz o papel da coluna neste modelo, que o texto herdado não diz"
        description: Chave do evento; é ela que torna o reprocessamento idempotente.
        data_tests: [unique, not_null]
      - name: idempotency_key
        description: "Chave que impede aplicação duplicada pelo consumidor (ADR-0019)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [not_null]
      - name: date_key
        description: "Chave substituta da data: hash de `full_date` (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: product_key
        description: "Chave substituta da **versão** da variante do produto: hash de `source_system`, `product_variant_id` e do início da vigência da versão (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_product'), field: product_key}
      - name: warehouse_key
        description: "Chave substituta do armazém: hash de `source_system` e `warehouse_id` (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_warehouse'), field: warehouse_key}
      - name: quantity_delta
        meta:
          sensitivity: internal
          description_reason: "diz a aditividade da medida nesta fato, que o texto herdado não diz; aditiva, porque é delta assinado (RVL3-10)"
        description: '**Aditiva** — variação assinada do saldo: positiva na entrada, negativa na saída; a soma num período é a variação líquida do estoque nele.'
        data_tests: [not_null]
      - name: cogs_amount
        meta:
          sensitivity: confidential
        description: '{{ doc("cost_of_goods_sold") }}'
        data_tests: [not_null]
      - name: movement_type
        description: "Tipo controlado do movimento; determina o sinal da quantidade."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - accepted_values:
              values: [purchase_receipt, customer_return, transfer_in, adjustment_in,
                       sale_dispatch, supplier_return, transfer_out, adjustment_out]
      - name: source_system
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: event_sequence
        description: "Ordem do evento dentro da sua origem. No varejo, a sequência técnica que o banco atribui; no legado, a identidade física da linha na captura — desempate técnico, sem promessa de ordem de negócio (D40)."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: source_type
        description: "Processo de negócio que originou o movimento."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: source_id
        description: "Identificador do registro que causou o movimento."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: correlation_id
        description: "Agrupa eventos relacionados; obrigatório nos pares de transferência."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: aggregate_version
        description: "Ordem do evento dentro do par armazém/SKU; sem lacuna nem repetição."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: occurred_at
        description: "Momento de negócio do movimento; é por ele que o Beam janela (ADR-0019)."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: recorded_at
        description: "Momento em que a origem registrou o evento; base da leitura incremental."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: movement_date
        description: "Data do movimento, no fuso de São Paulo."
        meta:
          sensitivity: internal
      - name: is_inbound
        description: "Verdadeiro quando o movimento é de entrada: todo tipo que não é venda, devolução a fornecedor, transferência de saída ou ajuste de saída."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_outbound
        description: "Verdadeiro quando o movimento é de saída: venda (`sale_dispatch`), devolução a fornecedor, transferência de saída ou ajuste de saída."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_sale
        description: "Verdadeiro quando o movimento é a saída de uma venda (`sale_dispatch`)."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: quantity_in
        description: "Aditiva — unidades que entraram no movimento; zero numa saída."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: quantity_out
        description: "Aditiva — unidades que saíram no movimento, em número positivo; zero numa entrada."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: unit_cost
        description: "Custo unitário, quando aplicável ao tipo."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: movement_cost_amount
        description: "Aditiva — custo do movimento: a quantidade movimentada, em valor absoluto, vezes o custo unitário (zero sem custo), arredondado a centavos."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: recording_delay_seconds
        description: "Segundos entre o instante de negócio do movimento e o seu registro na origem."
        meta:
          description_inherited: true
          sensitivity: internal

  # ── Etapa 8 — entrega e logística ──────────────────────────────────────────
  - name: dim_carrier
    meta:
      domain: logistica
    description: >
      Transportadora e a modalidade que ela presta. SCD tipo 1: a modalidade
      classifica o fato, mas não muda para uma transportadora contratada — o
      gatilho que a tornaria tipo 2 está escrito no próprio modelo.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, carrier_natural_key]
    columns:
      - name: carrier_key
        description: "Chave substituta da transportadora: hash de `source_system` e `carrier_id` (ADR-0017)."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: carrier_natural_key
        description: "Identificador da transportadora na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [not_null]
      - name: service_level
        meta:
          sensitivity: public
          description_reason: "liga a coluna ao conceito do glossário de negócio que ela determina"
        description: '{{ doc("promised_lead_time") }}'
        data_tests:
          - not_null
          - accepted_values: {values: [standard, express, same_day]}
      - name: is_deleted
        description: "{{ doc(\"is_deleted\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [not_null]
      - name: source_system
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: carrier_code
        description: "Código estável da transportadora."
        meta:
          description_inherited: true
          sensitivity: public
      - name: carrier_name
        description: "Nome da transportadora."
        meta:
          description_inherited: true
          sensitivity: public
      - name: service_level_rank
        description: "Ordem da modalidade, da mais lenta à mais rápida: 1 standard, 2 express, 3 same_day."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: tracking_url_template
        description: "Modelo de URL de rastreio, com marcador do código."
        meta:
          description_inherited: true
          sensitivity: public
      - name: is_active
        description: "Indica se a transportadora está em uso."
        meta:
          description_inherited: true
          sensitivity: internal

  - name: fact_shipment_item
    meta:
      domain: logistica
    description: >
      **Grão: um item de uma remessa.** Duas datas em papéis diferentes —
      `date_key` é o despacho, `delivered_date_key` é a chegada (ADR-0033). As
      colunas de grão de pedido (`order_to_delivery_days` e as vizinhas) são
      atributos repetidos: reduza ao pedido antes de agregar.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, shipment_item_id]
      - fato_reconcilia_com_a_condutora:
          config:
            tags: [fronteira]
          arguments:
            condutora: ref('shipment_items')
            medidas:
              quantity_shipped: quantity_shipped
    columns:
      - name: shipment_item_key
        meta:
          sensitivity: internal
        description: Prova do grão — uma linha por item de remessa.
        data_tests: [unique, not_null]
      - name: shipment_item_id
        description: "Identificador do item da remessa na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [not_null]
      - name: date_key
        meta:
          sensitivity: internal
          description_reason: "diz o papel da coluna neste modelo, que o texto herdado não diz"
        description: "Data de **despacho** da remessa."
        data_tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: delivered_date_key
        meta:
          sensitivity: internal
          description_reason: "diz o papel da coluna neste modelo, que o texto herdado não diz"
        description: "Data de **chegada**. Nula enquanto a remessa não chega, e o nulo significa *ainda não chegou* — o motivo está no cabeçalho do modelo. Sem `not_null` por isso; o `relationships` continua valendo para as linhas preenchidas."
        data_tests:
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: carrier_key
        description: "Chave substituta da transportadora: hash de `source_system` e `carrier_id` (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_carrier'), field: carrier_key}
      - name: warehouse_key
        description: "Chave substituta do armazém: hash de `source_system` e `warehouse_id` (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_warehouse'), field: warehouse_key}
      - name: customer_key
        description: "Chave substituta da **versão** do cliente (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_customer'), field: customer_key}
      - name: product_key
        description: "Chave substituta da **versão** da variante do produto: hash de `source_system`, `product_variant_id` e do início da vigência da versão (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_product'), field: product_key}
      - name: sales_channel_key
        description: "Chave substituta do canal de venda: hash de `source_system` e `sales_channel_id`; o membro desconhecido tem chave própria (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_sales_channel'), field: sales_channel_key}
      - name: geography_key
        description: "Lugar da entrega do pedido em `dim_geography`; o membro desconhecido quando o endereço não casa com nenhum lugar."
        meta:
          sensitivity: public
        data_tests:
          - not_null
          - relationships: {to: ref('dim_geography'), field: geography_key}
      - name: is_on_time
        meta:
          sensitivity: internal
        description: '{{ doc("on_time_delivery") }}'
      - name: order_to_delivery_days
        meta:
          sensitivity: internal
        description: '{{ doc("order_to_delivery_cycle") }}'
      - name: quantity_shipped
        meta:
          sensitivity: internal
          description_reason: "diz a aditividade da medida nesta fato, que o texto herdado não diz"
        description: '**Aditiva** — unidades que viajaram nesta caixa.'
        data_tests: [not_null]
      - name: shipment_status
        description: "Estado da remessa; transições válidas em Modelo de Dados §4."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - accepted_values:
              values: [created, picking, dispatched, in_transit, delivered, returned, lost]
      - name: source_system
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: shipment_id
        description: "Remessa à qual o item pertence."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: order_item_id
        description: "Item de pedido sendo enviado."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: order_id
        description: "Pedido ao qual o item pertence."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: shipment_code
        description: "Chave natural da remessa."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: order_number
        description: "Número do pedido; chave natural."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: tracking_code
        description: "Código de rastreio junto à transportadora."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: order_status
        description: "Estado atual do pedido; o histórico vive em `order_status_history`."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: placed_at
        description: "Momento de negócio em que o pedido foi feito."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: shipped_at
        description: "Momento do despacho."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: estimated_delivery_at
        description: "Prazo de entrega prometido ao cliente."
        meta:
          description_inherited: true
          sensitivity: public
      - name: delivered_at
        description: "Instante da entrega, o do último evento de entrega da remessa; nulo enquanto ela não foi entregue."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: returned_at
        description: "Instante da devolução, o do último evento de devolução; nulo sem devolução."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_dispatched
        description: "Verdadeiro quando a remessa saiu do armazém."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_delivered
        description: "Verdadeiro quando a remessa foi entregue."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_returned
        description: "Verdadeiro quando a remessa voltou ao remetente."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_lost
        description: "Verdadeiro quando a remessa está extraviada."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: order_shipment_count
        description: "Não aditiva entre itens — número de remessas do pedido, repetido em cada item dele."
        meta:
          sensitivity: internal
      - name: delivered_shipment_count
        description: "Não aditiva entre itens — remessas entregues do pedido, repetidas em cada item dele."
        meta:
          sensitivity: internal
      - name: is_order_cycle_closed
        description: "Verdadeiro quando todas as remessas do pedido foram entregues e o ciclo de entrega está fechado (ADR-0033)."
        meta:
          sensitivity: internal
      - name: is_cycle_closing_shipment
        description: "Verdadeiro na remessa que fecha o ciclo de entrega do pedido: a última entregue (ADR-0033)."
        meta:
          sensitivity: internal
      - name: is_split_order
        description: "Verdadeiro quando o pedido foi dividido em mais de uma remessa."
        meta:
          sensitivity: internal
      - name: order_delivered_at
        description: "Instante em que a última remessa do pedido foi entregue; nulo enquanto falta alguma."
        meta:
          sensitivity: internal
      - name: quantity_ordered
        description: "**Não aditiva entre itens de remessa** — quantidade comprada do SKU na linha do pedido, repetida em cada item de remessa da linha: some uma vez por linha do pedido, nunca por item de remessa."
        meta:
          sensitivity: internal
          description_reason: a fato está no grão do item de remessa e o valor é da linha do pedido — o herdado não diz o grão (RVL3-2-03)
      - name: shipped_share_of_line
        description: "Fração da linha do pedido que viajou nesta remessa: a quantidade enviada sobre a pedida, de 0 a 1."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: failed_attempt_count
        description: "**Não aditiva entre itens** — tentativas de entrega da remessa que falharam, repetidas em cada item dela: some uma vez por remessa, nunca por item."
        meta:
          sensitivity: public
          description_reason: a fato está no grão do item e o valor é da remessa — o herdado diria aditiva por item (RVL3-03)
      - name: delivery_delay_days
        description: "Dias entre a entrega e o prazo prometido: positivo é atraso, negativo é adiantamento; nulo sem entrega."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: transit_days
        description: "Dias entre o despacho e a entrega; nulo enquanto falta um dos dois."
        meta:
          description_inherited: true
          sensitivity: internal

  - name: fact_order_status_event
    meta:
      domain: vendas
    description: >
      **Grão: uma transição de estado do pedido.** A máquina de estados vista
      como fato: `orders.order_status` diz onde o pedido está hoje, e esta fato
      diz por onde ele passou.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, order_status_event_id]
      - fato_reconcilia_com_a_condutora:
          config:
            tags: [fronteira]
          arguments:
            condutora: ref('order_status_events')
            medidas:
              hours_in_previous_status: hours_in_previous_status
    columns:
      - name: order_status_event_key
        description: "Chave substituta da transição de estado do pedido: hash de `source_system` e `order_status_event_id` (ADR-0017)."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: order_status_event_id
        description: "Identificador da mudança de estado do pedido na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [not_null]
      - name: date_key
        description: "Chave substituta da data: hash de `full_date` (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: customer_key
        description: "Chave substituta da **versão** do cliente (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_customer'), field: customer_key}
      - name: sales_channel_key
        description: "Chave substituta do canal de venda: hash de `source_system` e `sales_channel_id`; o membro desconhecido tem chave própria (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_sales_channel'), field: sales_channel_key}
      - name: geography_key
        description: "Lugar da entrega do pedido em `dim_geography`; o membro desconhecido quando o endereço não casa com nenhum lugar."
        meta:
          sensitivity: public
        data_tests:
          - not_null
          - relationships: {to: ref('dim_geography'), field: geography_key}
      - name: to_status
        description: "Estado resultante da transição."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - accepted_values:
              values: [pending, paid, picking, shipped, delivered, cancelled, returned]
      - name: from_status
        meta:
          description_inherited: true
          sensitivity: internal
        description: "Estado anterior; nulo na criação do pedido."
        data_tests:
          - accepted_values:
              values: [pending, paid, picking, shipped, delivered, cancelled, returned]
      - name: hours_in_previous_status
        meta:
          sensitivity: internal
        description: '**Não aditiva** — tempo no estado de origem; soma dentro do pedido, nunca entre pedidos.'
      - name: transition_count
        meta:
          sensitivity: internal
        description: '**Aditiva** — sempre 1, para que a contagem seja uma soma explícita.'
        data_tests: [not_null]
      - name: source_system
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: order_id
        description: "Pedido cujo estado mudou."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: order_number
        description: "Número do pedido; chave natural."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: change_reason
        description: "Motivo registrado para a transição."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: status_sequence
        description: "Posição da transição na história do pedido, por ordem de data (1 é a criação)."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: placed_at
        description: "Momento de negócio em que o pedido foi feito."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: changed_at
        description: "Momento de negócio da transição."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: previous_changed_at
        description: "Instante da transição anterior do mesmo pedido; nulo na primeira."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: current_order_status
        description: "Estado atual do pedido; o histórico vive em `order_status_history`."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_order_creation
        description: "Verdadeiro na primeira transição do pedido, que não vem de estado nenhum."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_current_status
        description: "Verdadeiro na transição mais recente do pedido — a do estado em que ele está."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_terminal_status
        description: "Verdadeiro quando a transição leva o pedido a um estado final: `cancelled` ou `returned`."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_cancellation
        description: "Verdadeiro quando a transição leva o pedido a `cancelled`."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_return
        description: "Verdadeiro quando a transição leva o pedido a `returned`."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_realised
        description: "Verdadeiro quando o pedido é venda realizada: pago, em separação, enviado, entregue ou devolvido. O pendente e o cancelado não contam."
        meta:
          description_inherited: true
          sensitivity: internal

  # ── Etapa 9 — relacionamento e histórico ───────────────────────────────────
  - name: dim_campaign
    meta:
      domain: marketing
    description: Campanha e objetivo. SCD tipo 1 — o objetivo é fixado na criação e não muda.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, campaign_natural_key]
    columns:
      - name: campaign_key
        description: "Chave substituta da campanha: hash de `source_system` e `campaign_id` (ADR-0017)."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: campaign_natural_key
        description: "Identificador da campanha na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [not_null]
      - name: campaign_objective
        description: "Objetivo comercial da campanha."
        meta:
          description_inherited: true
          sensitivity: public
        data_tests:
          - not_null
          - accepted_values:
              values: [acquisition, retention, reactivation, clearance]
      - name: source_system
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: campaign_code
        description: "Código estável da campanha."
        meta:
          description_inherited: true
          sensitivity: public
      - name: campaign_name
        description: "Nome da campanha."
        meta:
          description_inherited: true
          sensitivity: public
      - name: campaign_valid_from
        description: "Início da vigência da campanha."
        meta:
          description_inherited: true
          sensitivity: public
      - name: campaign_valid_to
        description: "Fim da vigência da campanha."
        meta:
          description_inherited: true
          sensitivity: public
      - name: budget_amount
        description: "Orçamento previsto da campanha."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: campaign_is_active
        description: "Indica se a campanha está ativa."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_running
        description: "Verdadeiro quando a data de referência do armazém (`as_of_date`, 01/09/2026) cai dentro da vigência da campanha."
        meta:
          description_inherited: true
          sensitivity: public
      - name: is_finished
        description: "Verdadeiro quando a vigência da campanha terminou antes de a data de referência do armazém (`as_of_date`, 01/09/2026)."
        meta:
          description_inherited: true
          sensitivity: public
      - name: is_deleted
        description: "{{ doc(\"is_deleted\") }}"
        meta:
          description_inherited: true
          sensitivity: internal

  - name: dim_support_category
    meta:
      domain: atendimento
    description: >
      Categoria de chamado — **derivada** de uma *seed*, porque a origem só tem
      a lista dentro de um `CHECK` e uma dimensão precisa de nome legível e de
      agrupamento.
    columns:
      - name: support_category_key
        description: "Chave substituta da categoria de chamado: hash de `category_code` (ADR-0017)."
        meta:
          sensitivity: public
        data_tests: [unique, not_null]
      - name: support_category_natural_key
        description: "Código estável da categoria de chamado; chave natural."
        meta:
          description_inherited: true
          sensitivity: public
        data_tests: [unique, not_null]
      - name: support_category_name
        description: "Nome da categoria de chamado."
        meta:
          description_inherited: true
          sensitivity: public
        data_tests: [not_null]
      - name: support_category_group
        description: "Grupo que reúne categorias de chamado afins."
        meta:
          description_inherited: true
          sensitivity: public
      - name: support_category_description
        description: "O que a categoria de chamado cobre."
        meta:
          description_inherited: true
          sensitivity: public

  - name: dim_coupon
    meta:
      domain: marketing
    description: >
      Cupom. SCD tipo 2 no padrão misto: campanha e regra de desconto
      historizadas, uso acumulado corrente. `redemption_count` **não** entra nas
      `check_cols` do *snapshot* — cada resgate criaria uma versão, e a dimensão
      teria mais linhas que a fato que ela recorta.
    data_tests:
      - vigencias_sem_sobreposicao:
          chave_natural: coupon_natural_key
    columns:
      - name: coupon_key
        description: "Chave substituta da **versão** do cupom: hash de `source_system`, `coupon_id` e do início da vigência da versão (ADR-0017)."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: coupon_natural_key
        description: "Identificador do cupom na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [not_null]
      - name: discount_type
        description: "Natureza do desconto: percentage ou fixed."
        meta:
          description_inherited: true
          sensitivity: public
        data_tests:
          - not_null
          - accepted_values: {values: [percentage, fixed]}
      - name: is_deleted
        description: "{{ doc(\"is_deleted\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [not_null]
      - name: source_system
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: coupon_code
        description: "Código digitado pelo cliente."
        meta:
          description_inherited: true
          sensitivity: public
      - name: coupon_valid_from
        description: "Início da vigência do cupom."
        meta:
          description_inherited: true
          sensitivity: public
      - name: coupon_valid_to
        description: "Fim da vigência do cupom."
        meta:
          description_inherited: true
          sensitivity: public
      - name: max_redemptions
        description: "Limite total de utilizações; nulo quando ilimitado."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: redemption_count
        description: "**Aditiva entre cupons, só na versão vigente** (`is_current`) — resgates do cupom, com o valor atual repetido em cada versão dele; zero quando ele nunca foi usado."
        meta:
          sensitivity: internal
          description_reason: o valor atual de trusted, repetido em cada versão da dimensão — o herdado diria aditiva sem a vigência (RVL3-2-03)
      - name: redeemed_discount_amount
        description: "**Aditiva entre cupons, só na versão vigente** (`is_current`) — desconto total concedido nos resgates do cupom, com o valor atual repetido em cada versão dele; zero quando ele nunca foi usado."
        meta:
          sensitivity: confidential
          description_reason: o valor atual de trusted, repetido em cada versão da dimensão — o herdado diria aditiva sem a vigência (RVL3-2-03)
      - name: is_exhausted
        description: "Verdadeiro quando o cupom tem limite de usos e os resgates já o alcançaram."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_redeemable_now
        description: "Verdadeiro quando a data de referência do armazém (`as_of_date`, 01/09/2026) cai dentro da vigência do cupom."
        meta:
          description_inherited: true
          sensitivity: public
      - name: campaign_id
        description: "Campanha à qual o cupom pertence."
        meta:
          description_inherited: true
          sensitivity: public
      - name: campaign_code
        description: "Código estável da campanha."
        meta:
          description_inherited: true
          sensitivity: public
      - name: campaign_name
        description: "Nome da campanha."
        meta:
          description_inherited: true
          sensitivity: public
      - name: campaign_objective
        description: "Objetivo comercial da campanha."
        meta:
          description_inherited: true
          sensitivity: public
      - name: discount_value
        description: "Valor do desconto: percentual quando `percentage`, moeda quando `fixed`."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: min_order_amount
        description: "Valor mínimo de pedido para o cupom ser elegível."
        meta:
          description_inherited: true
          sensitivity: public
      - name: coupon_is_active
        description: "Indica se o cupom continua aceito."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: valid_from
        description: "Início da vigência da versão. Na primeira, o início do período simulado (01/01/2024), e não o instante da primeira captura do snapshot."
        meta:
          sensitivity: internal
      - name: valid_to
        description: "{{ doc(\"dbt_valid_to\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_current
        description: "Verdadeiro na versão vigente — a que não tem fim de vigência."
        meta:
          sensitivity: internal

  - name: dim_support_agent
    meta:
      domain: atendimento
    description: >
      Agente. SCD tipo 2 pela **equipe**, que classifica o chamado. Carrega o
      membro desconhecido: `ticket_events.agent_id` é nulo quando o autor é o
      cliente.
    data_tests:
      - vigencias_sem_sobreposicao:
          chave_natural: support_agent_natural_key
    columns:
      - name: support_agent_key
        description: "Chave substituta da **versão** do atendente: hash de `source_system`, `support_agent_id` e do início da vigência da versão (ADR-0017). O membro desconhecido tem chave própria."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: support_agent_natural_key
        description: "Identificador do atendente na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [not_null]
      - name: agent_team
        description: "Equipe de atendimento à qual o agente pertence."
        meta:
          description_inherited: true
          sensitivity: public
        data_tests: [not_null]
      - name: is_deleted
        description: "{{ doc(\"is_deleted\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [not_null]
      - name: source_system
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: agent_code
        description: "Chave natural do agente."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: agent_first_name
        description: "Primeiro nome do agente (sintético)."
        meta:
          description_inherited: true
          sensitivity: personal
      - name: agent_last_name
        description: "Sobrenome do agente (sintético)."
        meta:
          description_inherited: true
          sensitivity: personal
      - name: agent_full_name
        description: "Nome completo do atendente: o primeiro nome e o sobrenome, separados por espaço (sintético)."
        meta:
          description_inherited: true
          sensitivity: personal
      - name: agent_email
        description: "E-mail corporativo do agente (sintético)."
        meta:
          description_inherited: true
          sensitivity: personal
      - name: hired_at
        description: "Início do período de atuação do agente."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: handled_ticket_count
        description: "**Não aditiva entre atendentes nem entre versões** — chamados distintos em que o atendente registrou algum evento, com o valor atual repetido em cada versão dele; um chamado atendido por dois conta para os dois."
        meta:
          sensitivity: internal
          description_reason: o valor atual de trusted, repetido em cada versão da dimensão — o herdado diria aditiva sem a vigência (RVL3-2-03)
      - name: handled_event_count
        description: "**Aditiva entre atendentes, só na versão vigente** (`is_current`) — eventos de chamado registrados pelo atendente, com o valor atual repetido em cada versão dele."
        meta:
          sensitivity: internal
          description_reason: o valor atual de trusted, repetido em cada versão da dimensão — o herdado diria aditiva sem a vigência (RVL3-2-03)
      - name: agent_is_active
        description: "Indica se o agente continua atuando."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: valid_from
        description: "Início da vigência da versão. Na primeira, o início do período simulado (01/01/2024), e não o instante da primeira captura do snapshot."
        meta:
          sensitivity: internal
      - name: valid_to
        description: "Fim da vigência da versão: o `dbt_valid_to` do snapshot, que é `timestamp` sem fuso, convertido para `timestamptz` pelo fuso da sessão na união com o membro desconhecido; nulo na versão vigente."
        meta:
          sensitivity: internal
          description_reason: a união com `cast(null as timestamptz)` converte o `timestamp` do snapshot pelo fuso da sessão — o texto da convenção diria o valor intacto (RVL3-3-03)
      - name: is_current
        description: "Verdadeiro na versão vigente — a que não tem fim de vigência. O membro desconhecido é sempre vigente."
        meta:
          sensitivity: internal

  - name: fact_coupon_redemption
    meta:
      domain: marketing
    description: >
      **Grão: um uso de cupom**, um por pedido. Duas âncoras temporais de
      propósito — o cupom pela versão do **resgate**, o cliente pela versão da
      **venda**, que é a mesma de `fact_sales_order_item`.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, coupon_redemption_id]
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, order_id]
      - fato_reconcilia_com_a_condutora:
          config:
            tags: [fronteira]
          arguments:
            condutora: ref('coupon_redemptions')
            medidas:
              coupon_discount_amount: coupon_discount_amount
    columns:
      - name: coupon_redemption_key
        description: "Chave substituta do resgate de cupom: hash de `source_system` e `coupon_redemption_id` (ADR-0017)."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: coupon_redemption_id
        description: "Identificador do resgate de cupom na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [not_null]
      - name: order_id
        meta:
          sensitivity: internal
          description_reason: "acrescenta ao significado herdado a restrição que o teste deste modelo cobra"
        description: >
          Um cupom por pedido — **por origem**. A unicidade está no teste de
          combinação do modelo: dois sistemas numeram pedidos a partir de 1, e
          exigi-la do id sozinho reprovaria dado correto.
        data_tests: [not_null]
      - name: date_key
        description: "Chave substituta da data: hash de `full_date` (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: coupon_key
        description: "Chave substituta da **versão** do cupom: hash de `source_system`, `coupon_id` e do início da vigência da versão (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_coupon'), field: coupon_key}
      - name: campaign_key
        description: "Chave substituta da campanha: hash de `source_system` e `campaign_id` (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_campaign'), field: campaign_key}
      - name: customer_key
        description: "Chave substituta da **versão** do cliente (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_customer'), field: customer_key}
      - name: sales_channel_key
        description: "Chave substituta do canal de venda: hash de `source_system` e `sales_channel_id`; o membro desconhecido tem chave própria (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_sales_channel'), field: sales_channel_key}
      - name: geography_key
        description: "Lugar da entrega do pedido em `dim_geography`; o membro desconhecido quando o endereço não casa com nenhum lugar."
        meta:
          sensitivity: public
        data_tests:
          - not_null
          - relationships: {to: ref('dim_geography'), field: geography_key}
      - name: is_eligible
        meta:
          sensitivity: confidential
        description: As três condições da invariante 12 juntas — vigência, piso e teto.
        data_tests: [not_null]
      - name: coupon_discount_amount
        meta:
          sensitivity: confidential
          description_reason: "diz a aditividade da medida nesta fato, que o texto herdado não diz"
        description: '**Aditiva** — desconto efetivamente concedido.'
        data_tests: [not_null]
      - name: source_system
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: coupon_id
        description: "Cupom utilizado."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: order_number
        description: "Número do pedido; chave natural."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: coupon_code
        description: "Código digitado pelo cliente."
        meta:
          description_inherited: true
          sensitivity: public
      - name: discount_type
        description: "Natureza do desconto: percentage ou fixed."
        meta:
          description_inherited: true
          sensitivity: public
      - name: campaign_objective
        description: "Objetivo comercial da campanha."
        meta:
          description_inherited: true
          sensitivity: public
      - name: redemption_sequence
        description: "Posição do resgate entre os do mesmo cupom, por ordem de data (1 é o primeiro); é ela que mede o limite de usos."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: redeemed_at
        description: "Momento de negócio da utilização."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: placed_at
        description: "Momento de negócio em que o pedido foi feito."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_within_validity
        description: "Verdadeiro quando o resgate aconteceu dentro da vigência do cupom."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_above_minimum
        description: "Verdadeiro quando o subtotal do pedido alcança o valor mínimo do cupom, ou o cupom não tem mínimo."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: is_within_limit
        description: "Verdadeiro quando o resgate cabe no limite de usos do cupom, pela ordem dos resgates, ou o cupom não tem limite."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_discount_bounded
        description: "Verdadeiro quando o desconto do resgate não passa do subtotal do pedido."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: order_is_cancelled
        description: "Verdadeiro quando o pedido está cancelado."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_realised
        description: "Verdadeiro quando o pedido é venda realizada: pago, em separação, enviado, entregue ou devolvido. O pendente e o cancelado não contam."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: redemption_count
        description: "Aditiva — 1 por resgate: soma-se para contar resgates."
        meta:
          sensitivity: internal
      - name: order_subtotal_amount
        description: "Soma dos itens antes de desconto, frete e imposto."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: order_total_amount
        description: "Valor total do pedido; reconcilia os demais campos."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: discount_share_of_order
        description: "Não aditiva — fração do subtotal do pedido que o cupom descontou, de 0 a 1; nula em pedido sem subtotal."
        meta:
          sensitivity: confidential

  - name: fact_support_ticket_event
    meta:
      domain: atendimento
    description: >
      **Grão: um evento de um chamado.** Contar chamados aqui exige
      `count(distinct support_ticket_id)`; `event_count` é o que se soma.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, ticket_event_id]
      - fato_reconcilia_com_a_condutora:
          config:
            tags: [fronteira]
          arguments:
            condutora: ref('ticket_events')
            # só contagem: as horas até atribuição e resolução nascem na própria fato
    columns:
      - name: support_ticket_event_key
        description: "Chave substituta do evento de chamado: hash de `source_system` e `ticket_event_id` (ADR-0017)."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: ticket_event_id
        description: "Identificador do evento do chamado na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [not_null]
      - name: date_key
        description: "Chave substituta da data: hash de `full_date` (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: customer_key
