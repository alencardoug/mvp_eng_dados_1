              values: [created, assigned, message, status_changed, resolved, reopened]
      - name: event_count
        meta:
          sensitivity: internal
        description: '**Aditiva** — sempre 1, para que a contagem de eventos seja uma soma explícita.'
        data_tests: [not_null]
