version: 2

# Testes do datamart. Três famílias, e cada uma existe por um motivo diferente:
#
#   grão          prova que a fato é o que ela diz ser. `unique` sobre a chave
#                 do grão é a única forma de a afirmação "uma linha por item de
#                 pedido" deixar de ser intenção (ADR-0018).
#   integridade   `not_null` + `relationships` em toda chave de dimensão. É a
#                 salvaguarda estrutural que o ADR-0029 exige: se alguém filtrar
#                 membros excluídos de uma dimensão, as linhas de fato
#                 correspondentes ficam sem par e o *build* quebra.
#   vigência      as SCD tipo 2 não podem ter vigências sobrepostas, senão o
#                 *join* temporal duplica linha de fato (invariante 11).
#   reconciliação toda fato declara a relação condutora de `trusted` de que
#                 nasce e as medidas que têm de somar igual dos dois lados
#                 (`fato_reconcilia_com_a_condutora`, Qualidade §7). É o que
#                 pega a junção interna que derruba linha em silêncio. Leva a
#                 etiqueta `fronteira`: compara camadas que a DAG constrói em
#                 tarefas diferentes, e só roda depois da última delas.

models:
  # ── Dimensões ──────────────────────────────────────────────────────────────
  - name: dim_date
    description: Calendário do período simulado. Dimensão estática, gerada da série de datas.
    columns:
      - name: date_key
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: full_date
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: year_number
        meta:
          sensitivity: internal
      - name: quarter_number
        meta:
          sensitivity: internal
      - name: month_number
        meta:
          sensitivity: internal
      - name: month_name
        meta:
          sensitivity: internal
      - name: year_month
        meta:
          sensitivity: internal
      - name: day_of_month
        meta:
          sensitivity: internal
      - name: day_of_week
        meta:
          sensitivity: internal
      - name: day_name
        meta:
          sensitivity: internal
      - name: iso_week_number
        meta:
          sensitivity: internal
      - name: month_start_date
        meta:
          sensitivity: internal
      - name: quarter_start_date
        meta:
          sensitivity: internal
      - name: year_start_date
        meta:
          sensitivity: internal
      - name: is_weekend
        meta:
          sensitivity: internal

  - name: dim_customer
    description: '{{ doc("active_customer") }}'
    data_tests:
      - vigencias_sem_sobreposicao:
          chave_natural: customer_natural_key
    columns:
      - name: customer_key
        meta:
          sensitivity: internal
        description: Chave substituta da **versão** do cliente (ADR-0017).
        data_tests: [unique, not_null]
      - name: customer_natural_key
        meta:
          sensitivity: internal
        data_tests: [not_null]
      - name: is_active
        meta:
          sensitivity: internal
        description: '{{ doc("active_customer") }}'
      - name: is_repeat_buyer
        meta:
          sensitivity: internal
        description: '{{ doc("repeat_purchase") }}'
      - name: is_deleted
        meta:
          sensitivity: internal
        description: Exclusão lógica na origem; a linha permanece na dimensão (ADR-0029).
        data_tests: [not_null]
      - name: source_system
        meta:
          sensitivity: internal
      - name: customer_code
        meta:
          sensitivity: internal
      - name: first_name
        meta:
          sensitivity: personal
      - name: last_name
        meta:
          sensitivity: personal
      - name: customer_full_name
        meta:
          sensitivity: personal
      - name: customer_document
        meta:
          sensitivity: personal
      - name: birth_date
        meta:
          sensitivity: personal
      - name: registered_at
        meta:
          sensitivity: internal
      - name: first_order_at
        meta:
          sensitivity: internal
      - name: last_order_at
        meta:
          sensitivity: internal
      - name: order_count
        meta:
          sensitivity: internal
      - name: lifetime_net_revenue_amount
        meta:
          sensitivity: confidential
      - name: is_churned
        meta:
          sensitivity: internal
      - name: days_since_last_order
        meta:
          sensitivity: internal
      - name: customer_status
        meta:
          sensitivity: internal
      - name: customer_segment_id
        meta:
          sensitivity: internal
      - name: customer_segment_code
        meta:
          sensitivity: public
      - name: customer_segment_name
        meta:
          sensitivity: public
      - name: city
        meta:
          sensitivity: public
      - name: state_code
        meta:
          sensitivity: public
      - name: country
        meta:
          sensitivity: public
      - name: valid_from
        meta:
          sensitivity: internal
      - name: valid_to
        meta:
          sensitivity: internal
      - name: is_current
        meta:
          sensitivity: internal

  - name: dim_product
    description: SKU com produto, categoria e marca. SCD tipo 2.
    data_tests:
      - vigencias_sem_sobreposicao:
          chave_natural: product_natural_key
    columns:
      - name: product_key
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: product_natural_key
        meta:
          sensitivity: internal
        data_tests: [not_null]
      - name: is_deleted
        meta:
          sensitivity: internal
        data_tests: [not_null]
      - name: source_system
        meta:
          sensitivity: internal
      - name: sku
        meta:
          sensitivity: public
      - name: product_code
        meta:
          sensitivity: public
      - name: product_name
        meta:
          sensitivity: public
      - name: variant_size
        meta:
          sensitivity: public
      - name: variant_color
        meta:
          sensitivity: public
      - name: variant_package
        meta:
          sensitivity: public
      - name: barcode
        meta:
          sensitivity: public
      - name: weight_grams
        meta:
          sensitivity: public
      - name: product_id
        meta:
          sensitivity: internal
      - name: launched_at
        meta:
          sensitivity: public
      - name: product_status
        meta:
          sensitivity: internal
      - name: variant_is_active
        meta:
          sensitivity: internal
      - name: product_category_id
        meta:
          sensitivity: internal
      - name: leaf_category_name
        meta:
          sensitivity: public
      - name: sub_category_name
        meta:
          sensitivity: public
      - name: root_category_name
        meta:
          sensitivity: public
      - name: brand_id
        meta:
          sensitivity: internal
      - name: brand_name
        meta:
          sensitivity: public
      - name: brand_country
        meta:
          sensitivity: public
      - name: variant_is_deleted
        meta:
          sensitivity: internal
      - name: product_is_deleted
        meta:
          sensitivity: internal
      - name: valid_from
        meta:
          sensitivity: internal
      - name: valid_to
        meta:
          sensitivity: internal
      - name: is_current
        meta:
          sensitivity: internal

  - name: dim_category
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, category_natural_key]
    columns:
      - name: category_key
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: category_natural_key
        meta:
          sensitivity: internal
        data_tests: [not_null]
      - name: source_system
        meta:
          sensitivity: internal
      - name: category_name
        meta:
          sensitivity: public
      - name: sub_category_name
        meta:
          sensitivity: public
      - name: root_category_name
        meta:
          sensitivity: public
      - name: category_depth
        meta:
          sensitivity: public

  - name: dim_brand
    columns:
      - name: brand_key
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: source_system
        meta:
          sensitivity: internal
      - name: brand_natural_key
        meta:
          sensitivity: internal
      - name: brand_name
        meta:
          sensitivity: public
      - name: brand_country
        meta:
          sensitivity: public

  - name: dim_sales_channel
    description: >
      Canal de venda. Carrega um membro "Sem canal" desde a Etapa 9: chamado que
      não nasce de pedido não tem canal, e a alternativa seria chave nula na
      fato — que some de todo recorte em vez de aparecer agrupada.
    columns:
      - name: sales_channel_key
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: channel_type
        meta:
          sensitivity: public
        data_tests:
          - accepted_values:
              values: [web, app, store, unknown]
      - name: source_system
        meta:
          sensitivity: internal
      - name: sales_channel_natural_key
        meta:
          sensitivity: internal
      - name: sales_channel_code
        meta:
          sensitivity: public
      - name: sales_channel_name
        meta:
          sensitivity: public
      - name: is_active
        meta:
          sensitivity: internal
      - name: is_deleted
        meta:
          sensitivity: internal

  - name: dim_geography
    description: >
      Geografia conformada — atende a venda aqui e a remessa na Etapa 8. Carrega
      um membro "Desconhecido" para que a fato nunca fique com chave nula.
    columns:
      - name: geography_key
        meta:
          sensitivity: public
        data_tests: [unique, not_null]
      - name: region
        meta:
          sensitivity: public
        data_tests:
          - not_null
          - accepted_values:
              values: [Norte, Nordeste, Centro-Oeste, Sudeste, Sul, Desconhecido]
      - name: country
        meta:
          sensitivity: public
      - name: state_code
        meta:
          sensitivity: public
      - name: state_name
        meta:
          sensitivity: public
      - name: city
        meta:
          sensitivity: public

  # ── Fatos ──────────────────────────────────────────────────────────────────
  - name: fact_sales_order_item
    description: >
      **Grão: uma linha de item de pedido.** Um SKU comprado em um pedido.
      Medidas todas aditivas; valores de nível de pedido não estão aqui, porque
      somá-los no grão de item multiplicaria o frete pelo número de itens.
    data_tests:
      - fato_reconcilia_com_a_condutora:
          config:
            tags: [fronteira]
          arguments:
            condutora: ref('order_items')
            medidas:
              quantity: quantity
              net_revenue_amount: net_revenue_amount
              line_total_amount: line_total_amount
    columns:
      - name: order_item_key
        meta:
          sensitivity: internal
        description: Chave do grão. O `unique` abaixo é o que prova o grão declarado.
        data_tests: [unique, not_null]
      - name: date_key
        meta:
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: customer_key
        meta:
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_customer'), field: customer_key}
      - name: product_key
        meta:
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_product'), field: product_key}
      - name: sales_channel_key
        meta:
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_sales_channel'), field: sales_channel_key}
      - name: category_key
        meta:
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_category'), field: category_key}
      - name: geography_key
        meta:
          sensitivity: public
        data_tests:
          - not_null
          - relationships: {to: ref('dim_geography'), field: geography_key}
      - name: net_revenue_amount
        meta:
          sensitivity: confidential
        description: '{{ doc("net_revenue") }}'
        data_tests: [not_null]
      - name: quantity
        meta:
          sensitivity: internal
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between: {min_value: 1}
      - name: source_system
        meta:
          sensitivity: internal
      - name: brand_key
        meta:
          sensitivity: internal
      - name: order_id
        meta:
          sensitivity: internal
      - name: order_item_id
        meta:
          sensitivity: internal
      - name: order_number
        meta:
          sensitivity: internal
      - name: order_status
        meta:
          sensitivity: internal
      - name: order_date
        meta:
          sensitivity: internal
      - name: placed_at
        meta:
          sensitivity: internal
      - name: is_realised
        meta:
          sensitivity: internal
      - name: is_cancelled
        meta:
          sensitivity: internal
      - name: is_from_cart
        meta:
          sensitivity: internal
      - name: has_post_order_repeat
        meta:
          sensitivity: internal
      - name: is_repeat_window_closed
        meta:
          sensitivity: internal
      - name: days_to_next_order
        meta:
          sensitivity: internal
      - name: unit_price
        meta:
          sensitivity: confidential
      - name: gross_revenue_amount
        meta:
          sensitivity: confidential
      - name: discount_amount
        meta:
          sensitivity: confidential
      - name: tax_amount
        meta:
          sensitivity: confidential
      - name: line_total_amount
        meta:
          sensitivity: confidential

  - name: fact_cart_event
    description: >
      **Grão: um evento de ciclo de vida de um carrinho** (ADR-0028). Até dois
      por carrinho, a abertura e o desfecho. As medidas são contadores que valem
      só na linha em que fazem sentido, de modo que toda soma esteja certa em
      qualquer recorte.
    data_tests:
      - fato_reconcilia_com_a_condutora:
          config:
            tags: [fronteira]
          arguments:
            condutora: ref('cart_lifecycle_events')
            # A fato zera o valor fora da linha de abertura (comentário do modelo);
            # a condutora recebe a mesma regra, senão o carrinho somaria em dobro.
            medidas:
              cart_value_amount: "case when event_type = 'created' then cart_value_amount else 0 end"
    columns:
      - name: cart_event_key
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: event_date_key
        meta:
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: cart_created_date_key
        meta:
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: sales_channel_key
        meta:
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_sales_channel'), field: sales_channel_key}
      - name: customer_key
        meta:
          sensitivity: internal
        description: Nulo em sessão anônima — o carrinho existe, o cliente não foi identificado.
        data_tests:
          - relationships: {to: ref('dim_customer'), field: customer_key}
      - name: event_type
        meta:
          sensitivity: internal
        data_tests:
          - not_null
          - accepted_values:
              values: [created, converted, abandoned, expired]
      - name: source_system
        meta:
          sensitivity: internal
      - name: cart_id
        meta:
          sensitivity: internal
      - name: occurred_at
        meta:
          sensitivity: internal
      - name: event_date
        meta:
          sensitivity: internal
      - name: cart_created_date
        meta:
          sensitivity: internal
      - name: is_anonymous
        meta:
          sensitivity: internal
      - name: cart_count
        meta:
          sensitivity: internal
      - name: closed_cart_count
        meta:
          sensitivity: internal
      - name: converted_cart_count
        meta:
          sensitivity: internal
      - name: abandoned_cart_count
        meta:
          sensitivity: internal
      - name: cart_item_count
        meta:
          sensitivity: internal
      - name: cart_unit_count
        meta:
          sensitivity: internal
      - name: cart_value_amount
        meta:
          sensitivity: confidential
      - name: abandoned_value_amount
        meta:
          sensitivity: confidential

  # ══════════════════════════════════════════════════════════════════════════
  # Etapa 6 — financeiro e estoque
  # ══════════════════════════════════════════════════════════════════════════

  - name: dim_payment_method
    columns:
      - name: payment_method_key
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: method_type
        meta:
          sensitivity: public
        data_tests:
          - accepted_values:
              values: [credit_card, debit_card, pix, boleto, wallet, voucher]
      - name: source_system
        meta:
          sensitivity: internal
      - name: payment_method_natural_key
        meta:
          sensitivity: internal
      - name: payment_method_code
        meta:
          sensitivity: public
      - name: payment_method_name
        meta:
          sensitivity: public
      - name: is_card
        meta:
          sensitivity: public
      - name: is_instant
        meta:
          sensitivity: public
      - name: is_active
        meta:
          sensitivity: internal
      - name: is_deleted
        meta:
          sensitivity: internal

  - name: dim_supplier
    description: Fornecedor. SCD tipo 1 nesta etapa — a divergência do §3.2 está declarada no modelo.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, supplier_natural_key]
    columns:
      - name: supplier_key
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: supplier_natural_key
        meta:
          sensitivity: internal
        data_tests: [not_null]
      - name: source_system
        meta:
          sensitivity: internal
      - name: supplier_code
        meta:
          sensitivity: internal
      - name: supplier_legal_name
        meta:
          sensitivity: confidential
      - name: supplier_name
        meta:
          sensitivity: confidential
      - name: supplier_country
        meta:
          sensitivity: public
      - name: payment_terms_days
        meta:
          sensitivity: confidential
      - name: is_active
        meta:
          sensitivity: internal
      - name: is_deleted
        meta:
          sensitivity: internal

  - name: dim_warehouse
    description: Armazém, com a **mesma** `dim_geography` do endereço de entrega.
    columns:
      - name: warehouse_key
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: geography_key
        meta:
          sensitivity: public
        data_tests:
          - not_null
          - relationships: {to: ref('dim_geography'), field: geography_key}
      - name: source_system
        meta:
          sensitivity: internal
      - name: warehouse_natural_key
        meta:
          sensitivity: internal
      - name: warehouse_code
        meta:
          sensitivity: public
      - name: warehouse_name
        meta:
          sensitivity: public
      - name: warehouse_city
        meta:
          sensitivity: public
      - name: warehouse_state
        meta:
          sensitivity: public
      - name: warehouse_state_name
        meta:
          sensitivity: public
      - name: warehouse_region
        meta:
          sensitivity: public
      - name: warehouse_country
        meta:
          sensitivity: public
      - name: capacity_units
        meta:
          sensitivity: confidential
      - name: is_active
        meta:
          sensitivity: internal
      - name: is_deleted
        meta:
          sensitivity: internal

  - name: fact_payment_transaction
    description: >
      **Grão: uma tentativa ou operação financeira.** A operação recusada fica —
      "quantas tentativas foram precisas para receber" é a pergunta P09, e ela só
      existe se a recusa estiver aqui.
    data_tests:
      - fato_reconcilia_com_a_condutora:
          config:
            tags: [fronteira]
          arguments:
            condutora: ref('payment_transactions')
            medidas:
              transaction_amount: transaction_amount
              captured_amount: captured_amount
    columns:
      - name: payment_transaction_key
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: date_key
        meta:
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: payment_method_key
        meta:
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_payment_method'), field: payment_method_key}
      - name: customer_key
        meta:
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_customer'), field: customer_key}
      - name: transaction_type
        meta:
          sensitivity: internal
        data_tests:
          - accepted_values:
              values: [authorization, capture, void, refund]
      - name: transaction_result
        meta:
          sensitivity: internal
        data_tests:
          - accepted_values:
              values: [succeeded, failed, pending]
      - name: source_system
        meta:
          sensitivity: internal
      - name: sales_channel_key
        meta:
          sensitivity: internal
      - name: payment_transaction_id
        meta:
          sensitivity: internal
      - name: transaction_code
        meta:
          sensitivity: internal
      - name: payment_id
        meta:
          sensitivity: internal
      - name: payment_code
        meta:
          sensitivity: internal
      - name: order_id
        meta:
          sensitivity: internal
      - name: order_number
        meta:
          sensitivity: internal
      - name: gateway_response_code
        meta:
          sensitivity: internal
      - name: occurred_at
        meta:
          sensitivity: internal
      - name: installments
        meta:
          sensitivity: public
      - name: is_instalment_plan
        meta:
          sensitivity: public
      - name: attempt_count
        meta:
          sensitivity: internal
      - name: approved_count
        meta:
          sensitivity: internal
      - name: authorization_count
        meta:
          sensitivity: internal
      - name: approved_authorization_count
        meta:
          sensitivity: internal
      - name: transaction_amount
        meta:
          sensitivity: confidential
      - name: authorized_amount
        meta:
          sensitivity: confidential
      - name: captured_amount
        meta:
          sensitivity: confidential
      - name: refunded_amount
        meta:
          sensitivity: confidential

  - name: fact_refund
    description: '**Grão: um reembolso realizado.**'
    data_tests:
      - fato_reconcilia_com_a_condutora:
          config:
            tags: [fronteira]
          arguments:
            condutora: ref('refunds')
            medidas:
              refund_amount: refund_amount
    columns:
      - name: refund_key
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: date_key
        meta:
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: refund_amount
        meta:
          sensitivity: confidential
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between: {min_value: 0.01}
      - name: source_system
        meta:
          sensitivity: internal
      - name: payment_method_key
        meta:
          sensitivity: internal
      - name: customer_key
        meta:
          sensitivity: internal
      - name: sales_channel_key
        meta:
          sensitivity: internal
      - name: refund_id
        meta:
          sensitivity: internal
      - name: refund_code
        meta:
          sensitivity: internal
      - name: payment_transaction_id
        meta:
          sensitivity: internal
      - name: payment_id
        meta:
          sensitivity: internal
      - name: order_id
        meta:
          sensitivity: internal
      - name: order_number
        meta:
          sensitivity: internal
      - name: refund_reason
        meta:
          sensitivity: internal
      - name: refund_status
        meta:
          sensitivity: internal
      - name: refunded_at
        meta:
          sensitivity: internal
      - name: is_completed
        meta:
          sensitivity: internal
      - name: is_full_refund
        meta:
          sensitivity: confidential
      - name: refund_count
        meta:
          sensitivity: internal
      - name: originally_captured_amount
