        description: "Imposto simulado sobre este item."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: line_total_amount
        description: "Valor total da linha, já arredondado."
        meta:
          description_inherited: true
          sensitivity: confidential

  - name: fact_cart_event
    meta:
      domain: vendas
    description: >
      **Grão: um evento de ciclo de vida de um carrinho** (ADR-0028). Até dois
      por carrinho, a abertura e o desfecho. As medidas são contadores que valem
      só na linha em que fazem sentido, de modo que toda soma esteja certa em
      qualquer recorte.
    data_tests:
      - fato_reconcilia_com_a_condutora:
          config:
            tags: [fronteira]
          arguments:
            condutora: ref('cart_lifecycle_events')
            # A fato zera o valor fora da linha de abertura (comentário do modelo);
            # a condutora recebe a mesma regra, senão o carrinho somaria em dobro.
            medidas:
              cart_value_amount: "case when event_type = 'created' then cart_value_amount else 0 end"
    columns:
      - name: cart_event_key
        description: "Chave substituta do evento do carrinho: hash de `source_system`, `cart_id` e `event_type` — um evento de cada tipo por carrinho (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: event_date_key
        description: "Chave substituta da data: hash de `full_date` (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: cart_created_date_key
        description: "Chave substituta da data: hash de `full_date` (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: sales_channel_key
        description: "Chave substituta do canal de venda: hash de `source_system` e `sales_channel_id`; o membro desconhecido tem chave própria (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_sales_channel'), field: sales_channel_key}
      - name: customer_key
        meta:
          sensitivity: internal
          description_reason: "diz o papel da coluna neste modelo, que o texto herdado não diz"
        description: Nulo em sessão anônima — o carrinho existe, o cliente não foi identificado.
        data_tests:
          - relationships: {to: ref('dim_customer'), field: customer_key}
      - name: event_type
        description: "Estado do carrinho: open, converted, abandoned ou expired."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - accepted_values:
              values: [created, converted, abandoned, expired]
      - name: source_system
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: cart_id
        description: "Identificador do carrinho na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: occurred_at
        description: "Instante do evento: a criação do carrinho, no evento de criação; a conversão, no de conversão; e, no carrinho que não converteu, o que vier primeiro entre a expiração e a data de referência do armazém."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: event_date
        description: "Data do evento, no fuso de São Paulo."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: cart_created_date
        description: "Data da criação do carrinho, no fuso de São Paulo."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_anonymous
        description: "Verdadeiro quando o carrinho não tem cliente identificado — sessão anônima."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: cart_count
        description: "Aditiva — 1 no evento de criação do carrinho, 0 nos demais: soma-se para contar carrinhos."
        meta:
          sensitivity: internal
      - name: closed_cart_count
        description: "Aditiva — 1 no evento que fecha o carrinho (conversão, abandono ou expiração), 0 na criação."
        meta:
          sensitivity: internal
      - name: converted_cart_count
        description: "Aditiva — 1 quando o evento converte o carrinho em pedido, 0 nos demais."
        meta:
          sensitivity: internal
      - name: abandoned_cart_count
        description: "Aditiva — 1 quando o evento fecha o carrinho sem compra, por abandono ou expiração; 0 nos demais."
        meta:
          sensitivity: internal
      - name: cart_item_count
        description: "Aditiva — itens do carrinho, no evento de criação; 0 nos demais."
        meta:
          sensitivity: internal
      - name: cart_unit_count
        description: "Aditiva — unidades do carrinho, no evento de criação; 0 nos demais."
        meta:
          sensitivity: internal
      - name: cart_value_amount
        description: "Aditiva — valor do carrinho, no evento de criação; 0 nos demais."
        meta:
          sensitivity: confidential
      - name: abandoned_value_amount
        description: "Aditiva — valor do carrinho fechado sem compra, no evento de abandono ou expiração; 0 nos demais."
        meta:
          sensitivity: confidential

