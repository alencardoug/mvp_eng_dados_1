  - name: fact_support_ticket_event
    description: >
      **Grão: um evento de um chamado.** Contar chamados aqui exige
      `count(distinct support_ticket_id)`; `event_count` é o que se soma.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, ticket_event_id]
      - fato_reconcilia_com_a_condutora:
          config:
            tags: [fronteira]
          arguments:
            condutora: ref('ticket_events')
            # só contagem: as horas até atribuição e resolução nascem na própria fato
    columns:
      - name: support_ticket_event_key
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: ticket_event_id
        meta:
          sensitivity: internal
        data_tests: [not_null]
      - name: date_key
        meta:
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: customer_key
        meta:
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_customer'), field: customer_key}
      - name: support_category_key
        meta:
          sensitivity: public
        data_tests:
          - not_null
          - relationships: {to: ref('dim_support_category'), field: support_category_key}
      - name: support_agent_key
        meta:
          sensitivity: internal
        description: Membro desconhecido quando o autor do evento é o cliente.
        data_tests:
          - not_null
          - relationships: {to: ref('dim_support_agent'), field: support_agent_key}
      - name: sales_channel_key
        meta:
          sensitivity: internal
        description: Membro desconhecido quando o chamado não nasceu de um pedido.
        data_tests:
          - not_null
          - relationships: {to: ref('dim_sales_channel'), field: sales_channel_key}
      - name: geography_key
        meta:
          sensitivity: public
        data_tests:
          - not_null
          - relationships: {to: ref('dim_geography'), field: geography_key}
      - name: ticket_event_type
        meta:
          sensitivity: internal
        data_tests:
          - not_null
          - accepted_values:
              values: [created, assigned, message, status_changed, resolved, reopened]
      - name: event_count
        meta:
          sensitivity: internal
        description: '**Aditiva** — sempre 1, para que a contagem de eventos seja uma soma explícita.'
        data_tests: [not_null]
