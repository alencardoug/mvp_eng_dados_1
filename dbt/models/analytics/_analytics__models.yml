  - name: fact_inventory_movement
    description: >
      **Grão: um movimento de um SKU em um armazém.** Única fato `incremental`
      do projeto (ADR-0016), com as quatro proteções obrigatórias: `unique_key`,
      filtro por tempo de evento com margem, `--full-refresh` no plano da Etapa
      12, e o teste `incremental_confere_com_a_reconstrucao_completa`.
      A exceção tem **duas estratégias, uma por origem** (ADR-0042): `retail`
      chega por evento e entra por `merge` com a janela de atraso; `legacy` chega
      por captura e entra por `delete+insert`, com a partição reescrita inteira a
      cada execução. Para o ramo legado a idempotência vem do recorte por
      captura, não da `unique_key`, e a reconciliação por linha está em
      `legado_na_fato_segue_a_captura_corrente`.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, idempotency_key]
      - fato_reconcilia_com_a_condutora:
          config:
            tags: [fronteira]
          arguments:
            condutora: ref('inventory_movements')
            medidas:
              quantity_delta: quantity_delta
              cogs_amount: cogs_amount
    columns:
      - name: movement_key
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: movement_id
        meta:
          sensitivity: internal
        description: Chave do evento; é ela que torna o reprocessamento idempotente.
        data_tests: [unique, not_null]
      - name: idempotency_key
        meta:
          sensitivity: internal
        data_tests: [not_null]
      - name: date_key
        meta:
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: product_key
        meta:
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_product'), field: product_key}
      - name: warehouse_key
        meta:
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_warehouse'), field: warehouse_key}
      - name: quantity_delta
        meta:
          sensitivity: internal
        description: '**Semiaditiva** — soma por armazém e SKU, nunca ao longo do tempo.'
        data_tests: [not_null]
      - name: cogs_amount
        meta:
          sensitivity: confidential
        description: '{{ doc("cost_of_goods_sold") }}'
        data_tests: [not_null]
      - name: movement_type
        meta:
          sensitivity: internal
        data_tests:
          - accepted_values:
