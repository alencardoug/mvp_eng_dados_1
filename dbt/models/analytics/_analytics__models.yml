version: 2

# Testes do datamart. Três famílias, e cada uma existe por um motivo diferente:
#
#   grão          prova que a fato é o que ela diz ser. `unique` sobre a chave
#                 do grão é a única forma de a afirmação "uma linha por item de
#                 pedido" deixar de ser intenção (ADR-0018).
#   integridade   `not_null` + `relationships` em toda chave de dimensão. É a
#                 salvaguarda estrutural que o ADR-0029 exige: se alguém filtrar
#                 membros excluídos de uma dimensão, as linhas de fato
#                 correspondentes ficam sem par e o *build* quebra.
#   vigência      as SCD tipo 2 não podem ter vigências sobrepostas, senão o
#                 *join* temporal duplica linha de fato (invariante 11).
#   reconciliação toda fato declara a relação condutora de `trusted` de que
#                 nasce e as medidas que têm de somar igual dos dois lados
#                 (`fato_reconcilia_com_a_condutora`, Qualidade §7). É o que
#                 pega a junção interna que derruba linha em silêncio. Leva a
#                 etiqueta `fronteira`: compara camadas que a DAG constrói em
#                 tarefas diferentes, e só roda depois da última delas.

models:
  # ── Dimensões ──────────────────────────────────────────────────────────────
  - name: dim_date
    meta:
      domain: transversal
    description: Calendário do período simulado. Dimensão estática, gerada da série de datas.
    columns:
      - name: date_key
        description: "Chave substituta da data: hash de `full_date` (ADR-0017)."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: full_date
        description: "A data, uma linha por dia do calendário do período simulado."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: year_number
        description: "Ano da data."
        meta:
          sensitivity: internal
      - name: quarter_number
        description: "Trimestre do ano, de 1 a 4."
        meta:
          sensitivity: internal
      - name: month_number
        description: "Mês do ano, de 1 a 12."
        meta:
          sensitivity: internal
      - name: month_name
        description: "Nome do mês por extenso, no idioma do banco."
        meta:
          sensitivity: internal
      - name: year_month
        description: "Ano e mês, no formato AAAA-MM."
        meta:
          sensitivity: internal
      - name: day_of_month
        description: "Dia do mês, de 1 a 31."
        meta:
          sensitivity: internal
      - name: day_of_week
        description: "Dia da semana ISO: 1 é segunda-feira, 7 é domingo."
        meta:
          sensitivity: internal
      - name: day_name
        description: "Nome do dia da semana por extenso, no idioma do banco."
        meta:
          sensitivity: internal
      - name: iso_week_number
        description: "Número da semana ISO no ano."
        meta:
          sensitivity: internal
      - name: month_start_date
        description: "Primeiro dia do mês da data."
        meta:
          sensitivity: internal
      - name: quarter_start_date
        description: "Primeiro dia do trimestre da data."
        meta:
          sensitivity: internal
      - name: year_start_date
        description: "Primeiro dia do ano da data."
        meta:
          sensitivity: internal
      - name: is_weekend
        description: "Verdadeiro no sábado e no domingo."
        meta:
          sensitivity: internal

  - name: dim_customer
    meta:
      domain: clientes
    description: '{{ doc("active_customer") }}'
    data_tests:
      - vigencias_sem_sobreposicao:
          chave_natural: customer_natural_key
    columns:
      - name: customer_key
        meta:
          sensitivity: internal
        description: Chave substituta da **versão** do cliente (ADR-0017).
        data_tests: [unique, not_null]
      - name: customer_natural_key
        description: "Identificador do cliente na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [not_null]
      - name: is_active
        meta:
          sensitivity: internal
        description: '{{ doc("active_customer") }}'
      - name: is_repeat_buyer
        meta:
          sensitivity: internal
        description: '{{ doc("repeat_purchase") }}'
      - name: is_deleted
        meta:
          sensitivity: internal
          description_reason: "diz o papel da coluna neste modelo, que o texto herdado não diz"
        description: Exclusão lógica na origem; a linha permanece na dimensão (ADR-0029).
        data_tests: [not_null]
      - name: source_system
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: customer_code
        description: "Chave natural do cliente na origem; estável entre cargas."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: first_name
        description: "Primeiro nome do cliente (sintético)."
        meta:
          description_inherited: true
          sensitivity: personal
      - name: last_name
        description: "Sobrenome do cliente (sintético)."
        meta:
          description_inherited: true
          sensitivity: personal
      - name: customer_full_name
        description: "Nome completo do cliente: o primeiro nome e o sobrenome, separados por espaço (sintético)."
        meta:
          description_inherited: true
          sensitivity: personal
      - name: customer_document
        description: "Documento de identificação do cliente (sintético)."
        meta:
          description_inherited: true
          sensitivity: personal
      - name: birth_date
        description: "Data de nascimento do cliente (sintética)."
        meta:
          description_inherited: true
          sensitivity: personal
      - name: registered_at
        description: "Momento de negócio do cadastro, distinto de `created_at`."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: first_order_at
        description: "Instante do primeiro pedido realizado do cliente; nulo para quem nunca comprou."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: last_order_at
        description: "Instante do último pedido realizado do cliente; nulo para quem nunca comprou."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: order_count
        description: "**Aditiva entre clientes, só na versão vigente** (`is_current`) — pedidos realizados do cliente, com o valor atual repetido em cada versão dele; zero para quem nunca comprou."
        meta:
          sensitivity: internal
          description_reason: o valor atual de trusted, repetido em cada versão da dimensão — o herdado diria aditiva sem a vigência (RVL3-2-03)
      - name: lifetime_net_revenue_amount
        description: "**Aditiva entre clientes, só na versão vigente** (`is_current`) — receita líquida dos itens dos pedidos realizados do cliente, com o valor atual repetido em cada versão dele; zero para quem nunca comprou."
        meta:
          sensitivity: confidential
          description_reason: o valor atual de trusted, repetido em cada versão da dimensão — o herdado diria aditiva sem a vigência (RVL3-2-03)
      - name: is_churned
        description: "Verdadeiro quando o cliente já comprou, mas o último pedido realizado é anterior a 180 dias da data de referência do armazém (`active_customer_window_days`)."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: days_since_last_order
        description: "Dias entre o último pedido realizado do cliente e a data de referência do armazém; nulo para quem nunca comprou."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: customer_status
        description: "Estado do relacionamento: active, inactive, blocked ou pending."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: customer_segment_id
        description: "Segmento comercial ao qual o cliente pertence."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: customer_segment_code
        description: "Código estável do segmento, usado como chave natural."
        meta:
          description_inherited: true
          sensitivity: public
      - name: customer_segment_name
        description: "Nome do segmento do cliente; 'Sem segmento' quando ele não tem um."
        meta:
          sensitivity: public
      - name: city
        description: "Cidade; alimenta a dimensão de geografia."
        meta:
          description_inherited: true
          sensitivity: public
      - name: state_code
        description: "Unidade federativa em sigla de duas letras."
        meta:
          description_inherited: true
          sensitivity: public
      - name: country
        description: "País em código ISO de duas letras."
        meta:
          description_inherited: true
          sensitivity: public
      - name: valid_from
        description: "Início da vigência da versão. Na primeira, o início do período simulado (01/01/2024), e não o instante da primeira captura do snapshot."
        meta:
          sensitivity: internal
      - name: valid_to
        description: "{{ doc(\"dbt_valid_to\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_current
        description: "Verdadeiro na versão vigente — a que não tem fim de vigência."
        meta:
          sensitivity: internal

  - name: dim_product
    meta:
      domain: catalogo
    description: SKU com produto, categoria e marca. SCD tipo 2.
    data_tests:
      - vigencias_sem_sobreposicao:
          chave_natural: product_natural_key
    columns:
      - name: product_key
        description: "Chave substituta da **versão** da variante do produto: hash de `source_system`, `product_variant_id` e do início da vigência da versão (ADR-0017)."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: product_natural_key
        description: "Identificador da variante do produto (o SKU) na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [not_null]
      - name: is_deleted
        description: "Verdadeiro quando a variante, o seu produto ou a sua categoria foi excluído logicamente na origem (ADR-0029)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [not_null]
      - name: source_system
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: sku
        description: "Código de estoque da variante; chave natural do SKU."
        meta:
          description_inherited: true
          sensitivity: public
      - name: product_code
        description: "Chave natural do produto na origem."
        meta:
          description_inherited: true
          sensitivity: public
      - name: product_name
        description: "Nome comercial do produto."
        meta:
          description_inherited: true
          sensitivity: public
      - name: variant_size
        description: "Tamanho da variante."
        meta:
          description_inherited: true
          sensitivity: public
      - name: variant_color
        description: "Cor da variante."
        meta:
          description_inherited: true
          sensitivity: public
      - name: variant_package
        description: "Embalagem ou unidade de venda."
        meta:
          description_inherited: true
          sensitivity: public
      - name: barcode
        description: "Código de barras da variante (sintético)."
        meta:
          description_inherited: true
          sensitivity: public
      - name: weight_grams
        description: "Peso em gramas, usado no cálculo de frete."
        meta:
          description_inherited: true
          sensitivity: public
      - name: product_id
        description: "Identificador do produto na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: launched_at
        description: "Momento de lançamento comercial."
        meta:
          description_inherited: true
          sensitivity: public
      - name: product_status
        description: "Estado do produto: draft, active ou discontinued."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: variant_is_active
        description: "Indica se o SKU continua disponível para venda."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: product_category_id
        description: "Identificador da categoria na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: leaf_category_name
        description: "Nome comercial da categoria."
        meta:
          description_inherited: true
          sensitivity: public
      - name: sub_category_name
        description: "Nome da categoria intermediária da variante, entre a raiz e a folha; nulo quando a categoria da variante é uma raiz."
        meta:
          description_inherited: true
          sensitivity: public
      - name: root_category_name
        description: "Nome da categoria raiz da variante, no topo da árvore de categorias."
        meta:
          description_inherited: true
          sensitivity: public
      - name: brand_id
        description: "Identificador da marca na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: brand_name
        description: "Nome da marca do produto; 'Sem marca' quando ele não tem uma."
        meta:
          sensitivity: public
      - name: brand_country
        description: "País de origem, em código ISO."
        meta:
          description_inherited: true
          sensitivity: public
      - name: variant_is_deleted
        description: "{{ doc(\"is_deleted\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: product_is_deleted
        description: "{{ doc(\"is_deleted\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: valid_from
        description: "Início da vigência da versão. Na primeira, o início do período simulado (01/01/2024), e não o instante da primeira captura do snapshot."
        meta:
          sensitivity: internal
      - name: valid_to
        description: "{{ doc(\"dbt_valid_to\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_current
        description: "Verdadeiro na versão vigente — a que não tem fim de vigência."
        meta:
          sensitivity: internal

  - name: dim_category
    meta:
      domain: catalogo
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, category_natural_key]
    columns:
      - name: category_key
        description: "Chave substituta da categoria: hash de `source_system` e `product_category_id` (ADR-0017)."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: category_natural_key
        description: "Identificador da categoria na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [not_null]
      - name: source_system
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: category_name
        description: "Nome comercial da categoria."
        meta:
          description_inherited: true
          sensitivity: public
      - name: sub_category_name
        description: "Nome da categoria intermediária; na categoria que não tem intermediária, o da própria folha."
        meta:
          sensitivity: public
      - name: root_category_name
        description: "Nome da categoria raiz da variante, no topo da árvore de categorias."
        meta:
          description_inherited: true
          sensitivity: public
      - name: category_depth
        description: "Profundidade na hierarquia, com a raiz em zero."
        meta:
          description_inherited: true
          sensitivity: public

  - name: dim_brand
    meta:
      domain: catalogo
    columns:
      - name: brand_key
        description: "Chave substituta da marca: hash de `source_system` e `brand_id` (ADR-0017)."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: source_system
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: brand_natural_key
        description: "Identificador da marca na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: brand_name
        description: "Nome da marca."
        meta:
          description_inherited: true
          sensitivity: public
      - name: brand_country
        description: "País de origem, em código ISO."
        meta:
          description_inherited: true
          sensitivity: public

  - name: dim_sales_channel
    meta:
      domain: vendas
    description: >
      Canal de venda. Carrega um membro "Sem canal" desde a Etapa 9: chamado que
      não nasce de pedido não tem canal, e a alternativa seria chave nula na
      fato — que some de todo recorte em vez de aparecer agrupada.
    columns:
      - name: sales_channel_key
        description: "Chave substituta do canal de venda: hash de `source_system` e `sales_channel_id`; o membro desconhecido tem chave própria (ADR-0017)."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: channel_type
        description: "Natureza do canal: web, app ou store."
        meta:
          description_inherited: true
          sensitivity: public
        data_tests:
          - accepted_values:
              values: [web, app, store, unknown]
      - name: source_system
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: sales_channel_natural_key
        description: "Identificador do canal de venda na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: sales_channel_code
        description: "Código estável do canal."
        meta:
          description_inherited: true
          sensitivity: public
      - name: sales_channel_name
        description: "Nome do canal de venda."
        meta:
          description_inherited: true
          sensitivity: public
      - name: is_active
        description: "Indica se o canal continua operando."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_deleted
        description: "{{ doc(\"is_deleted\") }}"
        meta:
          description_inherited: true
          sensitivity: internal

  - name: dim_geography
    meta:
      domain: transversal
    description: >
      Geografia conformada — atende a venda aqui e a remessa na Etapa 8. Carrega
      um membro "Desconhecido" para que a fato nunca fique com chave nula.
    columns:
      - name: geography_key
        description: "Chave substituta do lugar: hash de país, unidade federativa e cidade; o membro desconhecido tem chave própria (ADR-0017)."
        meta:
          sensitivity: public
        data_tests: [unique, not_null]
      - name: region
        description: "Região do IBGE a que a unidade federativa pertence."
        meta:
          description_inherited: true
          sensitivity: public
        data_tests:
          - not_null
          - accepted_values:
              values: [Norte, Nordeste, Centro-Oeste, Sudeste, Sul, Desconhecido]
      - name: country
        description: "País em código ISO de duas letras."
        meta:
          description_inherited: true
          sensitivity: public
      - name: state_code
        description: "Unidade federativa em sigla de duas letras."
        meta:
          description_inherited: true
          sensitivity: public
      - name: state_name
        description: "Nome da unidade federativa por extenso."
        meta:
          description_inherited: true
          sensitivity: public
      - name: city
        description: "Cidade; alimenta a dimensão de geografia."
        meta:
          description_inherited: true
          sensitivity: public

  # ── Fatos ──────────────────────────────────────────────────────────────────
  - name: fact_sales_order_item
    meta:
      domain: vendas
    description: >
      **Grão: uma linha de item de pedido.** Um SKU comprado em um pedido.
      Medidas todas aditivas; valores de nível de pedido não estão aqui, porque
      somá-los no grão de item multiplicaria o frete pelo número de itens.
    data_tests:
      - fato_reconcilia_com_a_condutora:
          config:
            tags: [fronteira]
          arguments:
            condutora: ref('order_items')
            medidas:
              quantity: quantity
              net_revenue_amount: net_revenue_amount
              line_total_amount: line_total_amount
    columns:
      - name: order_item_key
        meta:
          sensitivity: internal
        description: Chave do grão. O `unique` abaixo é o que prova o grão declarado.
        data_tests: [unique, not_null]
      - name: date_key
        description: "Chave substituta da data: hash de `full_date` (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: customer_key
        description: "Chave substituta da **versão** do cliente (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_customer'), field: customer_key}
      - name: product_key
        description: "Chave substituta da **versão** da variante do produto: hash de `source_system`, `product_variant_id` e do início da vigência da versão (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_product'), field: product_key}
      - name: sales_channel_key
        description: "Chave substituta do canal de venda: hash de `source_system` e `sales_channel_id`; o membro desconhecido tem chave própria (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_sales_channel'), field: sales_channel_key}
      - name: category_key
        description: "Chave substituta da categoria: hash de `source_system` e `product_category_id` (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_category'), field: category_key}
      - name: geography_key
        description: "Lugar da entrega do pedido em `dim_geography`; o membro desconhecido quando o endereço não casa com nenhum lugar."
        meta:
          sensitivity: public
        data_tests:
          - not_null
          - relationships: {to: ref('dim_geography'), field: geography_key}
      - name: net_revenue_amount
        meta:
          sensitivity: confidential
        description: '{{ doc("net_revenue") }}'
        data_tests: [not_null]
      - name: quantity
        description: "Quantidade comprada do SKU."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between: {min_value: 1}
      - name: source_system
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: brand_key
        description: "Chave substituta da marca: hash de `source_system` e `brand_id` (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: order_id
        description: "Pedido ao qual o item pertence."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: order_item_id
        description: "Identificador do item do pedido na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: order_number
        description: "Número do pedido; chave natural."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: order_status
        description: "Estado atual do pedido; o histórico vive em `order_status_history`."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: order_date
        description: "Data do pedido, no fuso de São Paulo."
        meta:
          sensitivity: internal
      - name: placed_at
        description: "Momento de negócio em que o pedido foi feito."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_realised
        description: "Verdadeiro quando o pedido é venda realizada: pago, em separação, enviado, entregue ou devolvido. O pendente e o cancelado não contam."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_cancelled
        description: "Verdadeiro quando o pedido está cancelado."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_from_cart
        description: "Verdadeiro quando o pedido nasceu de um carrinho; falso em venda direta."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: has_post_order_repeat
        description: "Verdadeiro quando o cliente fez outro pedido realizado em até 90 dias depois deste (`repeat_purchase_window_days`); nulo enquanto a janela não fechou na data de referência do armazém (ADR-0036)."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_repeat_window_closed
