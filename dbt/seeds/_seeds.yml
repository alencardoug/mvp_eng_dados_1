version: 2

seeds:
  - name: brazilian_states
    description: >
      As 27 unidades federativas e a região de cada uma. É dado de referência
      geográfico, não dado gerado: entra por *seed* porque é estável, pequeno e
      precisa estar versionado para que `dim_geography` seja reprodutível.

      As 27 estão aqui, e não só as 14 que os endereços sintéticos usam — uma
      tabela de referência incompleta falha calada no dia em que a geração
      passar a produzir a 15ª.
    config:
      column_types:
        state_code: varchar(2)
    columns:
      - name: state_code
        data_tests: [unique, not_null]
      - name: region
        data_tests:
          - not_null
          - accepted_values:
              values: [Norte, Nordeste, Centro-Oeste, Sudeste, Sul]
